  function teilen(spruch) {
    var i = spruch.indexOf(":");
    if (i > 0 && i <= 42) {
      return { vor: spruch.slice(0, i + 1).trim(), text: spruch.slice(i + 1).trim() };
    }

  // ---------- Farbrechnen ----------
  function rgb(hex) {
    var h = hex.replace("#", "");
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function hex(r, g, b) {
    function t(v) { v = Math.max(0, Math.min(255, Math.round(v))); return (v<16?"0":"") + v.toString(16); }
    return "#" + t(r) + t(g) + t(b);
  }
  function hsl(hx) {
    var c = rgb(hx).map(function (v) { return v / 255; });
    var max = Math.max.apply(null, c), min = Math.min.apply(null, c);
    var l = (max + min) / 2, s = 0, h = 0, d = max - min;
    if (d) {
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === c[0]) h = ((c[1] - c[2]) / d + (c[1] < c[2] ? 6 : 0));
      else if (max === c[1]) h = (c[2] - c[0]) / d + 2;
      else h = (c[0] - c[1]) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }
  function ausHsl(h, s, l) {
    h = ((h % 360) + 360) % 360;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    var m = l - c / 2, r = 0, g = 0, b = 0;
    if (h < 60)       { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else              { r = c; b = x; }
    return hex((r + m) * 255, (g + m) * 255, (b + m) * 255);
  }
  function mischen(a, b, t) {
    var x = rgb(a), y = rgb(b);
    return hex(x[0]+(y[0]-x[0])*t, x[1]+(y[1]-x[1])*t, x[2]+(y[2]-x[2])*t);
  }

  // ---------- Vier klar unterscheidbare Farben ----------
  // Gedächtnis für diese Sitzung: zuletzt Gezogenes bleibt eine Weile gesperrt,
  // damit sich nichts unmittelbar wiederholt.
  var zuletztFarben = [], zuletztSprueche = [];

  function merken(liste, wert, vorrat) {
    liste.push(wert);
    var laenge = Math.min(Math.floor(vorrat / 3), 6);
    while (liste.length > laenge) liste.shift();
  }

  // Die vier liegen grau da, sichtbar wird nur die gezogene Farbe.
  // Deshalb reicht reiner Zufall aus dem Vorrat ohne die zuletzt gezogenen.
  function vierFarben() {
    var frei = FARBEN.filter(function (f) { return zuletztFarben.indexOf(f[0]) === -1; });
    if (frei.length < 8) frei = FARBEN.slice();
    var topf = frei.slice(), wahl = [];
    while (topf.length && wahl.length < 4) {

    return wahl;

  function schimmer(ctx, cx, cy, w, h) {
    // AB-Beschichtung: öliger Farbschleier
    var g = ctx.createLinearGradient(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2);
    g.addColorStop(0.00, "rgba(120,220,255,.30)");
    g.addColorStop(0.32, "rgba(200,160,255,.24)");
    g.addColorStop(0.58, "rgba(255,225,150,.26)");
    g.addColorStop(0.82, "rgba(150,255,210,.22)");
    g.addColorStop(1.00, "rgba(255,170,220,.26)");
    ctx.fillStyle = g;
    ctx.fill();
  }

    var hw = w / 2, hh = h / 2;
    var oben = cy - hh, unten = cy + hh;
    var N = 10;

    function pfadSilhouette() {
      ctx.beginPath();
      ctx.moveTo(cx, oben);
      ctx.lineTo(cx + hw, cy);
      ctx.lineTo(cx, unten);
      ctx.lineTo(cx - hw, cy);
      ctx.closePath();
    }

    pfadSilhouette();
    ctx.save(); ctx.clip();
    ctx.fillStyle = farbe;
    ctx.fillRect(cx - hw, oben, w, h);

    // Facetten von den Spitzen zur Mittelkante
    for (var i = 0; i < N; i++) {
      var x1 = cx - hw + (w * i) / N, x2 = cx - hw + (w * (i + 1)) / N;

      ctx.moveTo(cx, oben); ctx.lineTo(x1, cy); ctx.lineTo(x2, cy); ctx.closePath();

                            : mischen(farbe, "#000000", 0.05 - t * 0.30);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx, unten); ctx.lineTo(x1, cy); ctx.lineTo(x2, cy); ctx.closePath();
      ctx.fillStyle = t > 0 ? mischen(farbe, "#FFFFFF", 0.02 + t * 0.26)
                            : mischen(farbe, "#000000", 0.14 - t * 0.26);
      ctx.fill();

    // Lichtkante dort, wo die beiden Kegel aufeinandertreffen
    var lk = ctx.createLinearGradient(cx - hw, 0, cx + hw, 0);
    lk.addColorStop(0,    "rgba(255,255,255,0)");
    lk.addColorStop(0.34, "rgba(255,255,255,.62)");
    lk.addColorStop(0.62, "rgba(255,255,255,.22)");
    lk.addColorStop(1,    "rgba(255,255,255,0)");
    ctx.fillStyle = lk;
    ctx.fillRect(cx - hw, cy - h * 0.012, w, h * 0.024);

    // weiches Gesamtlicht, damit die Facettenkanten nicht hart aneinanderstossen
    var wl = ctx.createRadialGradient(cx - hw * 0.30, cy - hh * 0.34, 0,
                                      cx - hw * 0.30, cy - hh * 0.34, Math.max(w, h) * 0.78);
    wl.addColorStop(0,    "rgba(255,255,255,.30)");
    wl.addColorStop(0.36, "rgba(255,255,255,.09)");
    wl.addColorStop(1,    "rgba(255,255,255,0)");
    ctx.fillStyle = wl;
    ctx.fillRect(cx - hw, oben, w, h);

    var ws = ctx.createRadialGradient(cx, cy, Math.max(w, h) * 0.24, cx, cy, Math.max(w, h) * 0.56);
    ws.addColorStop(0, "rgba(0,0,0,0)");
    ws.addColorStop(1, mischen(farbe, "#000000", 0.45) + "3d");
    ctx.fillStyle = ws;
    ctx.fillRect(cx - hw, oben, w, h);

    if (ab) { pfadSilhouette(); schimmer(ctx, cx, cy, w, h); }
    ctx.restore();

    pfadSilhouette();
    ctx.strokeStyle = mischen(farbe, "#000000", 0.38);
    ctx.globalAlpha = 0.26;
    ctx.lineWidth = Math.max(0.8, w * 0.008);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Runde Perle: echte Facettenkugel. Die Schnittachse liegt fast waagerecht,
  // die Perle wird also von der Seite gesehen. Die Facetten stossen ohne harte
  // Trennlinien aneinander – jede hat einen eigenen weichen Verlauf.
  function rund(ctx, cx, cy, w, h, farbe, ab, dreh) {
    var r = Math.min(w, h) / 2;
    var LAT = 5, LON = 10;
    var aY = 1.43, aZ = 0.22 + (dreh || 0);
    var cY = Math.cos(aY), sY = Math.sin(aY), cZ = Math.cos(aZ), sZ = Math.sin(aZ);
    var Lx = -0.44, Ly = -0.54, Lz = 0.72;

    function ecke(theta, phi) {
      var x = Math.sin(theta) * Math.cos(phi),
          y = Math.sin(theta) * Math.sin(phi),
          z = Math.cos(theta);
      var x1 =  x * cY + z * sY, z1 = -x * sY + z * cY;
      return [x1 * cZ - y * sZ, x1 * sZ + y * cZ, z1];
    }

    function ton(b) {
      return b > 0 ? mischen(farbe, "#FFFFFF", Math.min(0.94, 0.04 + b * 0.74))
                   : mischen(farbe, "#000000", Math.min(0.50, 0.06 - b * 0.44));
    }

    var flaechen = [], i, j, k, maxR = 0.0001;
    for (i = 0; i < LAT; i++) {
      var t1 = (i / LAT) * Math.PI, t2 = ((i + 1) / LAT) * Math.PI;
      for (j = 0; j < LON; j++) {
        var f1 = (j / LON) * Math.PI * 2, f2 = ((j + 1) / LON) * Math.PI * 2;
        var e;
        if (i === 0) e = [ecke(t1, 0), ecke(t2, f1), ecke(t2, f2)];
        else if (i === LAT - 1) e = [ecke(t1, f1), ecke(t1, f2), ecke(t2, 0)];
        else e = [ecke(t1, f1), ecke(t1, f2), ecke(t2, f2), ecke(t2, f1)];

        var nx = 0, ny = 0, nz = 0;
        for (k = 0; k < e.length; k++) { nx += e[k][0]; ny += e[k][1]; nz += e[k][2]; }
        var len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
        nx /= len; ny /= len; nz /= len;
        if (nz <= -0.06) continue;
        for (k = 0; k < e.length; k++) {
          var rr = Math.sqrt(e[k][0] * e[k][0] + e[k][1] * e[k][1]);
          if (rr > maxR) maxR = rr;
        }
        flaechen.push({ e: e, n: [nx, ny, nz], z: nz });
      }
    }
    flaechen.sort(function (a, b) { return a.z - b.z; });

    var s = r / maxR;   // Facetten füllen den Kreis bis zum Rand

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    ctx.lineJoin = "round";

    for (i = 0; i < flaechen.length; i++) {
      var fl = flaechen[i];
      var b = fl.n[0] * Lx + fl.n[1] * Ly + fl.n[2] * Lz;
      var glanz = Math.pow(Math.max(0, b), 8) * 0.40;
      var mitte = ton(b + glanz);
      var hell  = ton(b + glanz + 0.16);
      var dunk  = ton(b + glanz - 0.16);

      var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, px, py;
      for (k = 0; k < fl.e.length; k++) {
        px = cx + fl.e[k][0] * s; py = cy + fl.e[k][1] * s;
        if (px < x0) x0 = px; if (px > x1) x1 = px;
        if (py < y0) y0 = py; if (py > y1) y1 = py;
      }
      var g = ctx.createLinearGradient(x1, y1, x0, y0);   // hell zur Lichtseite hin
      g.addColorStop(0, dunk);
      g.addColorStop(0.5, mitte);
      g.addColorStop(1, hell);

      ctx.beginPath();
      ctx.moveTo(cx + fl.e[0][0] * s, cy + fl.e[0][1] * s);
      for (k = 1; k < fl.e.length; k++) ctx.lineTo(cx + fl.e[k][0] * s, cy + fl.e[k][1] * s);
      ctx.closePath();
      ctx.fillStyle = g;
      ctx.fill();
      // feine, gleichfarbige Naht statt dunkler Kante – schliesst Lücken, ohne zu zeichnen
      ctx.strokeStyle = mitte;
      ctx.lineWidth = Math.max(0.6, r * 0.014);
      ctx.stroke();
    }

    // weiches Gesamtlicht: Glanzwolke oben links, sanfter Schatten am Rand
    var gl = ctx.createRadialGradient(cx - r * 0.34, cy - r * 0.40, 0,
                                      cx - r * 0.34, cy - r * 0.40, r * 1.05);
    gl.addColorStop(0,    "rgba(255,255,255,.38)");
    gl.addColorStop(0.32, "rgba(255,255,255,.12)");
    gl.addColorStop(1,    "rgba(255,255,255,0)");
    ctx.fillStyle = gl;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    var sch = ctx.createRadialGradient(cx, cy, r * 0.58, cx, cy, r);
    sch.addColorStop(0, "rgba(0,0,0,0)");
    sch.addColorStop(1, mischen(farbe, "#000000", 0.45) + "4d");
    ctx.fillStyle = sch;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    if (ab) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); schimmer(ctx, cx, cy, r * 2, r * 2); }
    ctx.restore();

    ctx.beginPath(); ctx.arc(cx, cy, r - 0.3, 0, Math.PI * 2);
    ctx.strokeStyle = mischen(farbe, "#000000", 0.35);
    ctx.globalAlpha = 0.22;
    ctx.lineWidth = Math.max(0.7, r * 0.018);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  var GRAU = "#D6D5D1";

  function kristall(ctx, cx, cy, w, h, f, mitLicht, grau) {
    var ton = grau ? GRAU : f[1];
    var ab = grau ? false : istAb(f[0]);
    if (mitLicht) {
      var g = ctx.createRadialGradient(cx, cy + h * 0.56, 1, cx, cy + h * 0.56, w * 0.95);
      g.addColorStop(0,    mischen(ton, "#FFFFFF", 0.20) + "bb");
      g.addColorStop(0.45, mischen(ton, "#FFFFFF", 0.55) + "4d");
      g.addColorStop(1,    "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(cx, cy + h * 0.56, w * 0.95, h * 0.28, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (f[2] === "rund") {
      // leichte Eigendrehung je Farbe, damit nicht alle Perlen identisch liegen
      var d = 0, i;
      for (i = 0; i < f[0].length; i++) d = (d * 31 + f[0].charCodeAt(i)) % 997;
      rund(ctx, cx, cy, w, h, ton, ab, (d / 997) * Math.PI * 2 / 14);
    } else {
      bicone(ctx, cx, cy, w, h, ton, ab);
    }
  }

  // ---------- Auslegen ----------
  function auslegen() {
    var box = $("kristalle");
    box.innerHTML = "";
    vierFarben().forEach(function (f) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "kristall";
      b.setAttribute("aria-label", "Kristall wählen");
      var c = document.createElement("canvas");
      var S = 2, G = 150;
      c.width = G * S; c.height = G * S;
      var ctx = c.getContext("2d");
      ctx.scale(S, S);
      kristall(ctx, G / 2, G / 2 - 6, G * 0.58, G * 0.60, f, true, true);
      b.appendChild(c);
      b.addEventListener("click", function () { ziehen(f); });
      box.appendChild(b);
    });
  }

  // ---------- Kärtchen ----------
  function umbrechen(ctx, text, maxB) {
    var w = text.split(" "), z = [], akt = "";
    for (var i = 0; i < w.length; i++) {
      var v = akt ? akt + " " + w[i] : w[i];
      if (ctx.measureText(v).width > maxB && akt) { z.push(akt); akt = w[i]; }
      else akt = v;
    }
    if (akt) z.push(akt);
    return z;
  }
  function gesperrt(ctx, text, x, y, px) {
    var alt = ctx.letterSpacing, ging = false;
    try { ctx.letterSpacing = px + "px"; ging = true; } catch (e) {}
    if (ging) { ctx.fillText(text, x, y); ctx.letterSpacing = alt || "0px"; return; }
    var b = 0, i;
    for (i = 0; i < text.length; i++) b += ctx.measureText(text[i]).width + px;
    b -= px;
    var cx = x - b / 2;
    var alteAus = ctx.textAlign;
    ctx.textAlign = "left";
    for (i = 0; i < text.length; i++) {
      ctx.fillText(text[i], cx, y);
      cx += ctx.measureText(text[i]).width + px;
    }
    ctx.textAlign = alteAus;
  }

  function karteZeichnen(spruch, f) {
    var S = 1080, sk = S / 1080;
    var c = document.createElement("canvas");
    c.width = S; c.height = S;
    var ctx = c.getContext("2d");

    var H = hsl(f[1]);
    var grund, schrift, spruchFarbe;

    // sehr heller Ton derselben Farbe, Schrift bleibt schwarz
    grund = H[1] < 0.07 ? "#FBFAF8" : ausHsl(H[0], Math.min(0.62, Math.max(0.30, H[1])), 0.945);
    schrift = "#191919";
    spruchFarbe = "#191919";

    var g = ctx.createLinearGradient(0, 0, S * 0.7, S);
    g.addColorStop(0, mischen(grund, "#000000", 0.07));
    g.addColorStop(1, mischen(grund, "#FFFFFF", 0.05));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, S, S);

    // feines Funkeln
    var s = 1337;
    function rnd() { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }
    for (var i = 0; i < 120; i++) {
      var x = rnd() * S, y = rnd() * S, r = rnd() * 3 + 1;
      var gg = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
      gg.addColorStop(0, "rgba(255,255,255," + (0.10 + rnd() * 0.30) + ")");
      gg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(x, y, r * 4, 0, Math.PI * 2); ctx.fill();
    }

    var rand = S * 0.115, maxB = S - rand * 2;

    // Spruch
    // Obere Hälfte gehört allein dem Spruch: die Schrift wächst, bis sie die Hälfte füllt.
    // Ein Satz bleibt ein Satz – gleiche Grösse, gleiche Stärke, gleicher Zeilenabstand.
    // Nur ein Doppelpunkt setzt den Vorspann ab: er steht fett, der Rest normal.
    var teil = teilen(spruch);
    // Rand oben wie an den Seiten, unten Luft zum Kristall; der Block sitzt
    // mittig in dem, was dazwischen übrig bleibt.
    var bandOben = S * 0.125, bandUnten = S * 0.44;
    var band = bandUnten - bandOben, zeilAb = 1.28, absatz = 0.45;
    var gross = Math.round(96 * sk), klein = Math.round(30 * sk), g, zV = [], zT = [];
    for (g = gross; g >= klein; g -= 2) {
      ctx.font = "600 " + g + 'px "Montserrat", Arial, sans-serif';
      zV = teil.vor ? umbrechen(ctx, teil.vor, maxB) : [];
      ctx.font = "400 " + g + 'px "Montserrat", Arial, sans-serif';
      zT = umbrechen(ctx, teil.text, maxB);
      var zeilen = zV.length + zT.length + (zV.length ? absatz : 0);
      if (zeilen * g * zeilAb <= band) break;
    }

    var hoehe = (zV.length + zT.length + (zV.length ? absatz : 0)) * g * zeilAb;
    var y = (bandOben + bandUnten) / 2 - hoehe / 2;

    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillStyle = spruchFarbe;

    if (zV.length) {
      ctx.font = "600 " + g + 'px "Montserrat", Arial, sans-serif';
      for (var k = 0; k < zV.length; k++) ctx.fillText(zV[k], S / 2, y + k * g * zeilAb);
      y += (zV.length + absatz) * g * zeilAb;
    }
    ctx.font = "400 " + g + 'px "Montserrat", Arial, sans-serif';
    for (var j = 0; j < zT.length; j++) ctx.fillText(zT[j], S / 2, y + j * g * zeilAb);

    // Untere Hälfte: Kristall, Farbname, Logo, Adresse
    kristall(ctx, S / 2, S * 0.605, S * 0.130, S * 0.135, f, true);

    // Eine gemeinsame Grösse für alles unter dem Spruch
    var kl = Math.round(26 * sk);

    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = schrift;

    // Farbname – fett, weil er etwas aussagt
    ctx.font = "600 " + kl + 'px "Montserrat", Arial, sans-serif';
    gesperrt(ctx, f[0].toUpperCase(), S / 2, S * 0.735, 4.2 * sk);

    // La Royal / Lanzarote
    ctx.font = "500 " + Math.round(52 * sk) + 'px "Playfair Display", Georgia, serif';
    ctx.fillText("La Royal", S / 2, S * 0.855);
    ctx.font = "400 " + kl + 'px "Montserrat", Arial, sans-serif';
    ctx.globalAlpha = 0.75;
    gesperrt(ctx, "LANZAROTE", S / 2, S * 0.898, 6 * sk);

    ctx.font = "400 " + kl + 'px "Montserrat", Arial, sans-serif';
    ctx.globalAlpha = 0.6;
    ctx.fillText("laroyallanzarote.com/orakel", S / 2, S * 0.938);
    ctx.globalAlpha = 1;

    return c;
  }

  // ---------- Ablauf ----------
  function malen() {
    if (!letzteWahl) return;
    var leinwand = karteZeichnen(letzteWahl.spruch, letzteWahl.farbe);
    $("karte").src = leinwand.toDataURL("image/png");
    $("karte").alt = "Spruchkärtchen in " + letzteWahl.farbe[0] + ": " + letzteWahl.spruch;
    leinwand.toBlob(function (b) { letzterBlob = b; }, "image/png");
  }

  function ziehen(farbe) {
    var spruch = neuerSpruch();
    merken(zuletztSprueche, spruch, SPRUECHE.length);
    merken(zuletztFarben, farbe[0], FARBEN.length);
    letzteWahl = { farbe: farbe, spruch: spruch };
    malen();
    $("hinweis").innerHTML = "&nbsp;";
    $("ziehen").hidden = true;
    $("ergebnis").hidden = false;
    var b = $("buehne");
    b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  $("btnNochmal").addEventListener("click", function () {
    auslegen();
    $("ergebnis").hidden = true;
    $("ziehen").hidden = false;
    window.scrollTo({ top: 0, behavior: "auto" });
  });

  $("btnSpeichern").addEventListener("click", function () {
    if (!letzterBlob) return;
    try {
      var url = URL.createObjectURL(letzterBlob);
      var a = document.createElement("a");
      a.href = url; a.download = "funkel-orakel.png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      $("hinweis").innerHTML = "Gespeichert. Am Handy: lange auf das Kärtchen tippen und <strong>Bild sichern</strong> wählen.";
    } catch (e) {
      $("hinweis").innerHTML = "Am Handy: lange auf das Kärtchen tippen und <strong>Bild sichern</strong> wählen.";
    }
  });

  $("btnTeilen").addEventListener("click", function () {
    if (!letzterBlob) return;
    var datei = null;
    try { datei = new File([letzterBlob], "funkel-orakel.png", { type: "image/png" }); } catch (e) {}
    if (datei && navigator.canShare && navigator.canShare({ files: [datei] })) {
      navigator.share({ files: [datei] }).then(function () {}).catch(function () {});
    } else {
      $("hinweis").innerHTML = "Teilen als Bild geht auf dem Handy. Am Rechner: <strong>Bild speichern</strong> und selbst hochladen.";
    }
  });

  auslegen();

  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('700 60px "Montserrat"'),
      document.fonts.load('600 40px "Montserrat"'),
      document.fonts.load('400 40px "Montserrat"'),
      document.fonts.load('500 60px "Playfair Display"')
    ]).then(malen).catch(function () {});
  }

  // ---------- Tanjas Ansicht: nur über #liste erreichbar ----------
  function istListe() {
    var h = (window.location.hash || "").replace(/^#/, "").trim().toLowerCase();
    return h.indexOf("liste") === 0;
  }

  function zeigen(spruch, farbe) {
    letzteWahl = { farbe: farbe, spruch: spruch };
    malen();
    $("hinweis").innerHTML = "&nbsp;";
    $("ergebnis").hidden = false;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function gewaehlteFarbe() {
    var w = $("farbwahl").value;
    if (w === "zufall") return FARBEN[Math.floor(Math.random() * FARBEN.length)];
    return FARBEN.filter(function (f) { return f[0] === w; })[0] || FARBEN[0];
  }

  function listeAufbauen() {
    var ul = $("spruchliste"), suche = $("suche").value.trim().toLowerCase();
    ul.innerHTML = "";
    var treffer = 0;
    SPRUECHE.forEach(function (sp, i) {
      if (suche && sp.toLowerCase().indexOf(suche) === -1) return;
      treffer++;
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      var nr = document.createElement("span");
      nr.className = "nr";
      nr.textContent = (i + 1) + ".";
      b.appendChild(nr);
      b.appendChild(document.createTextNode(sp));
      b.addEventListener("click", function () { zeigen(sp, gewaehlteFarbe()); });
      li.appendChild(b);
      ul.appendChild(li);
    });
    $("zaehler").textContent = suche
      ? treffer + " von " + SPRUECHE.length + " Sprüchen"
      : SPRUECHE.length + " Sprüche";
  }

  var listeBereit = false;
  function listeVorbereiten() {
    if (listeBereit) return;
    listeBereit = true;
    var sel = $("farbwahl");
    FARBEN.forEach(function (f) {
      var o = document.createElement("option");
      o.value = f[0]; o.textContent = f[0];
      sel.appendChild(o);
    });
    $("suche").addEventListener("input", listeAufbauen);
    sel.addEventListener("change", function () {
      if (letzteWahl) zeigen(letzteWahl.spruch, gewaehlteFarbe());
    });
  }

  function ansichtSetzen() {
    $("titel").textContent = istListe() ? "Deine Sprüche" : "Funkel Orakel";
    if (istListe()) {
      listeVorbereiten();
      listeAufbauen();
      $("ziehen").hidden = true;
      $("listeAnsicht").hidden = false;
      $("btnNochmal").hidden = true;
      if (!letzteWahl) $("ergebnis").hidden = true;
    } else {
      $("listeAnsicht").hidden = true;
      $("btnNochmal").hidden = false;
      $("ziehen").hidden = false;
      $("ergebnis").hidden = true;
    }
  }

  // ---------- Umgebung ----------
  var eingebettet = false;
  try { eingebettet = window.self !== window.top; } catch (e) { eingebettet = true; }

  // Im Shop-Einbau steht die Marke schon in der Navigation darüber,
  // und die Adresse steht schon in der Adresszeile des Browsers.
  // Auf dem Kärtchen-Bild bleibt die Adresse in jedem Fall stehen.
  if (eingebettet) {
    $("kopf").hidden = true;
    $("fuss").hidden = true;
  }

  // ---------- Höhe an den Shop melden ----------
  function hoeheMelden() {
    if (!eingebettet) return;
    var el = document.querySelector(".huelle");
    if (!el) return;
    var h = Math.ceil(el.getBoundingClientRect().height + 48);
    try { window.parent.postMessage({ funkelOrakel: "hoehe", hoehe: h }, "*"); } catch (e) {}
  }

  if (eingebettet) {
    if (window.ResizeObserver) {
      try { new ResizeObserver(hoeheMelden).observe(document.querySelector(".huelle")); } catch (e) {}
    }
    window.addEventListener("resize", hoeheMelden);
    window.addEventListener("load", hoeheMelden);
    setTimeout(hoeheMelden, 250);
    setTimeout(hoeheMelden, 1200);
    setTimeout(hoeheMelden, 2600);
  }

  window.addEventListener("hashchange", ansichtSetzen);
  ansichtSetzen();

})();
</script>
</body>
