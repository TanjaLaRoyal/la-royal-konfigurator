<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Royal – Wunsch-Charm</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sand: #faf9f6; --lava: #1a1a1a; --gold: #a8843f;
  --soft: #f4f3ef; --text: #111;
}
body { background: transparent; color: var(--text); font-family: 'Jost', sans-serif; font-weight: 300; display: flex; flex-direction: column; align-items: center; padding: 0; }
header { text-align: center; margin-bottom: 36px; }
.brand { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(2.2rem, 6vw, 3.6rem); letter-spacing: 0.18em; color: var(--lava); line-height: 1; }
.tagline { font-size: 16px; letter-spacing: 0.2em; text-transform: uppercase; color: #111; margin-top: 8px; }
.divider { width: 48px; height: 1px; background: var(--gold); margin: 20px auto 0; }
.card { background: transparent; padding: 20px 28px; width: 100%; max-width: 720px; }
.charm-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--soft); padding: 24px 20px 18px; border-radius: 1px; margin-bottom: 28px; }
.progress { display: flex; align-items: flex-start; max-width: 480px; margin: 0 auto 32px; }
.p-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; position: relative; }
.p-step::before { content: ''; position: absolute; top: 13px; left: calc(-50% + 17px); width: calc(100% - 34px); height: 1px; background: #ddd; }
.p-step:first-child::before { display: none; }
.p-step.done::before { background: var(--gold); }
.p-dot { width: 27px; height: 27px; border-radius: 50%; border: 1px solid #ddd; background: transparent; color: #999; display: flex; align-items: center; justify-content: center; font-size: 13px; font-family: 'Jost', sans-serif; transition: all 0.3s; }
.p-step.done .p-dot { background: var(--gold); border-color: var(--gold); color: #fff; }
.p-step.current .p-dot { border-color: #111; color: #111; font-weight: 500; }
.p-label { font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; text-align: center; color: #999; line-height: 1.3; transition: color 0.3s; }
.p-step.done .p-label, .p-step.current .p-label { color: #111; }
.preview-label { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: #111; font-style: italic; text-align: center; min-height: 1.4em; }
.preview-label.filled { font-style: normal; font-size: 16px; }
.lava-swatch { display:inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.lava-swatch.schwarz { background: radial-gradient(circle at 35% 35%, #585858, #1a1a1a 60%, #0a0a0a); }
.lava-swatch.kupfer  { background: radial-gradient(circle at 35% 35%, #fff5ea, #efcfaa 40%, #cf9a6c 80%, #8f6040); }
.section-label { font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; color: #111; margin-bottom: 12px; font-weight: 500; }
.section { margin-bottom: 28px; }
.option-row { display: flex; gap: 10px; flex-wrap: wrap; }
.option-btn { border: 1px solid #ddd; background: transparent; padding: 10px 20px; border-radius: 1px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 300; color: var(--text); transition: all 0.2s; }
.option-btn:hover:not(.active) { border-color: #111; }
.option-btn.active { border-color: #111; background: var(--gold); color: #fff; }
.option-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.count-options { display: flex; gap: 10px; flex-wrap: wrap; }
.count-btn { border: 1px solid #ddd; background: transparent; padding: 10px 20px; border-radius: 1px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 300; color: var(--text); transition: all 0.2s; }
.count-btn.active { border-color: #111; background: var(--gold); color: #fff; }
.count-btn:hover:not(.active) { border-color: #111; }
.color-slot { margin-bottom: 16px; }
.slot-label { font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; color: #111; margin-bottom: 8px; font-weight: 500; }
.color-options { display: flex; flex-wrap: wrap; gap: 7px; }
.color-chip { display: flex; align-items: center; gap: 7px; border: 1px solid #ddd; padding: 6px 10px; border-radius: 1px; cursor: pointer; font-size: 15px; transition: all 0.2s; background: transparent; font-family: 'Jost', sans-serif; font-weight: 300; color: var(--text); }
.color-chip:hover { border-color: #111; }
.color-chip.active { border-color: #111; background: #f4f3ef; }
.color-dot { width: 18px; height: 18px; flex-shrink: 0; }
.seiten-titel { font-family: 'Jost', sans-serif; font-weight: 300; font-size: clamp(1.4rem, 3.5vw, 2rem); letter-spacing: 0.18em; line-height: 1.35; text-transform: uppercase; text-align: center; color: #111; margin-bottom: 52px; }
@media (max-width: 420px) { .seiten-titel { font-size: 1.25rem; letter-spacing: 0.1em; } }
.summary-box { display: none; position: relative; background: #fdfcfa; border: 1px solid #ddd; border-radius: 1px; padding: 18px 20px; margin-bottom: 20px; }
.summary-box.visible { display: block; }
.summary-title { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: #111; font-weight: 500; margin-bottom: 10px; }
.summary-text { font-size: 16px; color: #000; font-weight: 400; line-height: 1.7; white-space: pre-line; font-family: 'Jost', sans-serif; }
.copy-btn { position: absolute; top: 14px; right: 14px; margin: 0; padding: 6px; border: none; background: transparent; color: #111; cursor: pointer; line-height: 0; }
.copy-btn svg { width: 18px; height: 18px; }
.order-hint { font-family: 'Jost', sans-serif; font-size: 15px; color: #000; font-weight: 400; text-align: center; margin: 10px 0 0; }
.auswahl-zeile { display: flex; flex-direction: column; gap: 14px; }
.auswahl-zeile .summary-text { order: 1; }
.mini-vorschau { order: 2; align-self: center; width: 150px; height: auto; display: block; background: #f4f3ef; border: 1px solid #ddd; }
@media (min-width: 560px) {
  .auswahl-zeile { flex-direction: row; align-items: center; justify-content: center; gap: 32px; }
  .mini-vorschau { order: 0; width: 170px; }
  .summary-title { text-align: center; }
}
.order-btn { display: block; width: fit-content; margin: 0 auto; padding: 10px 22px; background: #a8843f; color: #fff; border: none; border-radius: 20px; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; text-align: center; text-decoration: none; transition: background 0.2s; }
.order-btn:hover { filter: brightness(0.92); }
.save-row { display: none; flex-direction: column; align-items: center; margin-top: 6px; }
.save-row.visible { display: flex; }
.save-btn { display: inline-flex; align-items: center; gap: 9px; padding: 7px 18px; background: transparent; color: #a8843f; border: 1px solid #a8843f; border-radius: 24px; font-family: 'Jost', sans-serif; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
.save-btn:hover { background: #f4f3ef; }
.save-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.save-hint { font-family: 'Jost', sans-serif; font-size: 13px; color: #111; margin: 6px 0 0; text-align: center; min-height: 1em; }

/* Erledigte Schritte (seit 14.10.2026): Überschrift schwarz mit goldenem Haken, goldener Balken links,
   zarter Goldschimmer dahinter, gewählter Wert in normaler Schrift. Gold nur als Fläche und Symbol,
   nie als Lesetext – zu wenig Kontrast (Tanjas Regel: guter Kontrast geht vor). */
.section-label.done, .slot-label.done { color: #111; border-left: 3px solid #a8843f; background: linear-gradient(90deg, #f4f3ef, rgba(244,243,239,0)); padding: 6px 10px; margin-left: -10px; }
.section-label .haken, .slot-label .haken { color: #a8843f; }
.section-label .wahl, .slot-label .wahl { font-weight: 400; letter-spacing: 0.04em; text-transform: none; }
/* Farben (seit 14.10.2026): ein Gold #a8843f, eine Fläche #f4f3ef, Kasten "Deine Auswahl" #fdfcfa, Text #111, Rahmen #ddd, inaktive Balken-Beschriftung #999 – sonst nichts */
.design-btn.active, .metal-btn.active, .option-btn.active, .color-chip.active, .pos-btn.active { border-color: #a8843f; box-shadow: inset 0 0 0 1px #a8843f; background: #f4f3ef; color: #111; }
.count-btn.active { background: #f4f3ef; border-color: #a8843f; box-shadow: inset 0 0 0 1px #a8843f; color: #111; }
.metal-swatch { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.metal-swatch.silber { background: linear-gradient(135deg, #d4d8dc, #8a9299); }
.metal-swatch.gold   { background: linear-gradient(135deg, #e8c97e, #b8863a); }

/* Kasten "Deine Auswahl" als Zielpunkt (seit 14.10.2026): erscheint nach dem ersten Schritt, zeigt
   erledigte Schritte mit Haken und offene als "noch wählen"; "Jetzt bestellen" ist grau, bis alles gewählt ist */
.summary-text .offen::before { content: '\25CB  '; color: #999; }
.summary-text .fertig::before { content: '\2713  '; color: #a8843f; }
.order-btn.gesperrt { background: #ddd; color: #111; pointer-events: none; }
.copy-btn.versteckt { display: none; }
</style>
</head>
<body>

<div style="width:48px; height:1px; background:#a8843f; margin:60px auto 16px;"></div>
<h2 class="seiten-titel">Bündel Charm</h2>

<div class="card">
  <div class="charm-wrap">
    <canvas id="charm-canvas" width="900" height="615" style="width:300px;height:205px;"></canvas>
    <div class="preview-label" id="preview-label">Wähle dein Edelstahl und deine Kristallfarben.</div>
    <div class="save-row" id="save-row">
      <button type="button" class="save-btn" id="btn-speichern" onclick="bildSpeichern()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
        <span id="btn-speichern-text">Bild speichern</span>
      </button>
      <p class="save-hint" id="save-hint"></p>
    </div>
  </div>

  <div class="progress" id="progress"></div>

  <!-- 1: Edelstahl -->
  <div class="section">
    <div class="section-label" id="metal-section-label">1 · Edelstahl</div>
    <div class="option-row" id="metal-row">
      <button class="option-btn" onclick="setMetal('Silber', this)"><span class="metal-swatch silber"></span>Silber</button>
      <button class="option-btn" onclick="setMetal('Gold', this)"><span class="metal-swatch gold"></span>Gold</button>
    </div>
  </div>

  <!-- 2: Anzahl Farben -->
  <div class="section">
    <div class="section-label" id="count-section-label">2 · Wie viele Kristallfarben?</div>
    <div class="count-options">
      <button class="count-btn" onclick="setCount(1, this)">Einfarbig</button>
      <button class="count-btn" onclick="setCount(2, this)">2 Farben</button>
      <button class="count-btn" onclick="setCount(3, this)">3 Farben + Lava</button>
      <button class="count-btn" onclick="setCount(4, this)">4 Farben</button>
    </div>
    <div id="lava-block" style="display:none; margin-top:18px;">
      <div class="slot-label">Lava</div>
      <div class="option-row" id="lava-row">
        <button class="option-btn" onclick="setLava('Schwarz', this)"><span class="lava-swatch schwarz"></span>Schwarz</button>
        <button class="option-btn" onclick="setLava('Helles Kupfer', this)"><span class="lava-swatch kupfer"></span>Helles Kupfer</button>
      </div>
    </div>
  </div>

  <!-- 3: Mix oder Farbverlauf -->
  <div class="section" id="mode-section" style="display:none">
    <div class="section-label" id="mode-section-label">3 · Anordnung</div>
    <div class="option-row" id="mode-row">
      <button class="option-btn" onclick="setMode('mix', this)">Mix</button>
      <button class="option-btn" onclick="setMode('verlauf', this)">Farbverlauf</button>
    </div>
  </div>

  <!-- 4: Farben -->
  <div class="section" id="color-section" style="display:none">
    <div class="section-label" id="color-section-label">4 · Kristallfarben wählen</div>
    <div id="slots-wrapper"></div>
  </div>

  <div class="summary-box" id="summary-box">
    <div class="summary-title">Deine Auswahl</div>
    <div class="auswahl-zeile">
      <img class="mini-vorschau" id="mini-vorschau" alt="Dein Charm">
      <div class="summary-text" id="summary-text"></div>
    </div>
    <button class="copy-btn" id="copy-btn" onclick="copyText()" title="Auswahl kopieren" aria-label="Auswahl kopieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg></button>
    <a class="order-btn" id="order-btn" href="https://laroyallanzarote.com/products/bundel-charm-wunschanfertigung" target="_top" style="margin-top:18px">Jetzt bestellen</a>
    <p class="order-hint">Im nächsten Schritt legst du deinen Charm in den Warenkorb.</p>
  </div>

</div>

<script>
const COLORS = [
  { name: 'Weisser Opal',                  hex: '#F5F3EE', shimmer: '#F9F8F5', shape: 'round'  },
  { name: 'Schimmer Perle',                hex: '#FEFEFC', shimmer: '#FEFEFD', shape: 'round', stop: 'klar' },
  { name: 'Silbermine AB',                    hex: '#67655F', shimmer: '#D4D4D2', shape: 'bicone', stop: 0.75 },
  { name: 'Himmelblau AB',                 hex: '#99D6F8', shimmer: '#C2E6FB', shape: 'bicone' },
  { name: 'Capri Blau AB',                 hex: '#013CAC', shimmer: '#678ACD', shape: 'round'  },
  { name: 'Meeresblau',                    hex: '#3547A6', shimmer: '#8691CA', shape: 'bicone' },
  { name: 'Nachtblau',                    hex: '#36537D', shimmer: '#8698B1', shape: 'round'  },
  { name: 'Türkise Lagune AB',             hex: '#04AD99', shimmer: '#68CEC2', shape: 'bicone' },
  { name: 'Atlantik Türkis dunkel matt',   hex: '#3CA6B2', shimmer: '#8ACAD1', shape: 'bicone' },
  { name: 'Zitrus Grün',                   hex: '#D0EC40', shimmer: '#E3F48C', shape: 'bicone' },
  { name: 'Olivin Grün',                   hex: '#85A752', shimmer: '#91B063', shape: 'bicone' },
  { name: 'El Golfo Grün',                 hex: '#0B6F0D', shimmer: '#6DA96E', shape: 'bicone' },
  { name: 'Citrin Gelb AB',               hex: '#FDF158', shimmer: '#FEFCAA', shape: 'round'  },
  { name: 'Sonnenschein Matt',             hex: '#FEF6C0', shimmer: '#FEFAD9', shape: 'round'  },
  { name: 'Abendsonne',                    hex: '#FACB35', shimmer: '#FCE086', shape: 'bicone' },
  { name: 'Manrique Orange',               hex: '#FF8C00', shimmer: '#FFBA66', shape: 'bicone' },
  { name: 'Glühende Lava',                 hex: '#FE5302', shimmer: '#FE9867', shape: 'bicone' },
  { name: 'Hibiskus Rot AB',               hex: '#D00F10', shimmer: '#E36F70', shape: 'bicone' },
  { name: 'Rotes Magma',                   hex: '#A32A0A', shimmer: '#FF7A00', shape: 'bicone' },
  { name: 'Venus',                         hex: '#7B4A26', shimmer: '#EED4A8', shape: 'round', stop: 0.75 },
  { name: 'Rosaline',                      hex: '#FDDAEA', shimmer: '#FEE9F2', shape: 'bicone' },
  { name: 'Pink Safir Matt',               hex: '#FCCEE0', shimmer: '#FDE2EC', shape: 'bicone' },
  { name: 'Rose AB',                       hex: '#EE8FB8', shimmer: '#F3B1CD', shape: 'round'  },
  { name: 'Pinke Buganvilla AB',           hex: '#DF1683', shimmer: '#EC73B5', shape: 'bicone' },
  { name: 'Pinke Buganvilla Matt',         hex: '#C53773', shimmer: '#DC87AB', shape: 'bicone' },
  { name: 'Heller Amethyst',               hex: '#D6BCD7', shimmer: '#DAC3DB', shape: 'bicone' },
];

const EMPTY = { hex: '#d4d0c8', shimmer: '#e8e4dc', shape: 'round' };
const LAVA  = { hex: '#1a1a1a', shimmer: '#585858', shape: 'lava'  };

// Lava "Helles Kupfer" (galvanisiert) – begrenzter Vorrat. Auf false stellen, wenn
// sie ausverkauft ist: die Lava-Wahl bei "3 Farben + Lava" verschwindet.
const LAVA_KUPFER_VERFUEGBAR = true;

const state = {
  metal: null,
  lava:  null,  // 'Schwarz' | 'Helles Kupfer' – nur bei "3 Farben + Lava"
  count: null,
  mode:  null,  // 'mix' | 'verlauf'
  slots: [],
};

function getMetalColor() {
  if (state.metal === 'Gold') return { hex: '#c9a96e', shimmer: '#e8d49a' };
  return { hex: '#a8b0b8', shimmer: '#d0d6da' };
}

function getCrystalAt(pos) {
  // "3 Farben + Lava": sobald die Lava-Farbe gewählt ist, die Lavaperlen schon zeigen
  // (Mix-Positionen), auch bevor die Anordnung gewählt wurde
  if (state.count === 3 && !state.mode) return (state.lava && (pos === 0 || pos === 4)) ? LAVA : EMPTY;
  if (!state.count || !state.mode) return EMPTY;
  let slotIdx;

  if (state.mode === 'verlauf') {
    if (state.count === 1) {
      slotIdx = 0;
    } else if (state.count === 2) {
      slotIdx = pos < 4 ? 0 : 1;                    // 1-4 = Farbe 1, 5-8 = Farbe 2
    } else if (state.count === 3) {
      if (pos === 0 || pos === 1) return LAVA;       // Position 1+2 = Lava
      slotIdx = Math.floor((pos - 2) / 2);           // 3+4=0, 5+6=1, 7+8=2
    } else {
      slotIdx = Math.floor(pos / 2);                 // 1+2=0, 3+4=1, 5+6=2, 7+8=3
    }
  } else {
    // Mix (bisherige Logik)
    if (state.count === 1) {
      slotIdx = 0;
    } else if (state.count === 2) {
      slotIdx = pos % 2;
    } else if (state.count === 3) {
      if (pos === 0 || pos === 4) return LAVA;
      slotIdx = [1,2,3,5,6,7].indexOf(pos) % 3;
    } else {
      slotIdx = pos % 4;
    }
  }

  const name = state.slots[slotIdx];
  if (!name) return EMPTY;
  return COLORS.find(c => c.name === name) || EMPTY;
}

function drawLavaKupfer(ctx, x, y, r) {
  // Helles Kupfer: Champagner-Basis mit Kupfer-Wärme, grobe Poren, Glanzpunkt
  const g = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .05, x, y, r);
  g.addColorStop(0, '#fff5ea'); g.addColorStop(.4, '#efcfaa'); g.addColorStop(.85, '#cf9a6c'); g.addColorStop(1, '#8f6040');
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = 'rgba(110,60,35,0.5)';
  [[-.28, -.18], [.22, .28], [-.1, .35], [.34, -.12], [.1, -.34], [-.34, .12],
   [.05, .05], [-.45, -.3], [.4, .35], [-.2, -.42]].forEach(([dx, dy], i) => {
    ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, r * (i < 6 ? .11 : .07), 0, Math.PI * 2); ctx.fill();
  });
  const sh = ctx.createRadialGradient(x - r * .3, y - r * .32, 0, x - r * .3, y - r * .32, r * .45);
  sh.addColorStop(0, 'rgba(255,255,255,0.65)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = sh; ctx.fill();
}

function drawLava(ctx, x, y, r) {
  const g = ctx.createRadialGradient(x-r*.3, y-r*.3, r*.05, x, y, r);
  g.addColorStop(0,'#585858'); g.addColorStop(.45,'#252525'); g.addColorStop(1,'#0a0a0a');
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.4)';
  [[-.28,-.18],[.22,.28],[-.1,.35],[.34,-.12],[.1,-.34],[-.34,.12]].forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.arc(x+dx*r,y+dy*r,r*.11,0,Math.PI*2); ctx.fill();
  });
}

function darken(hex, f) {
  return `rgb(${[1,3,5].map(i => Math.round(parseInt(hex.slice(i,i+2),16)*f)).join(',')})`;
}

// Durchsichtiger Kristall (Schimmer Perle, seit 11.10.2026): Man sieht den Hintergrund
// durch, dazu liegt ein ganz zarter Regenbogenschleier (AB) darüber. Tanjas Wahl, weil
// die Schimmer Perle sonst wie der Weisse Opal aussah. Ausgelöst durch stop: 'klar' in COLORS.
// Schimmer Perle: durchsichtiger, geschliffener Kristall. Deckt ab, was dahinter liegt.
function drawKlar(ctx, x, y, r) {
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  drawKlarGlas(ctx, x, y, r);
  drawKlarFacetten(ctx, x, y, r);
}

function drawKlarFacetten(ctx, x, y, r) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
  // vier Reihen Schliffflächen, abwechselnd hell und leicht grau
  const B = [-1, -.52, 0, .52, 1];
  for (let b = 0; b < 4; b++) {
    const y0 = B[b], y1 = B[b + 1], ym = (y0 + y1) / 2;
    const w = Math.sqrt(Math.max(0, 1 - ym * ym)), n = (b === 0 || b === 3) ? 3 : 5;
    const sw = 2 * w / n, off = (b % 2) * sw * .5 - w;
    for (let i = -1; i <= n; i++) {
      const xa = off + i * sw, xb = xa + sw;
      ctx.beginPath();
      ctx.moveTo(x + xa * r, y + y0 * r); ctx.lineTo(x + xb * r, y + y0 * r);
      ctx.lineTo(x + (xb + sw * .25) * r, y + y1 * r); ctx.lineTo(x + (xa + sw * .25) * r, y + y1 * r);
      ctx.closePath();
      ctx.fillStyle = ((i + b) % 2 === 0) ? 'rgba(255,255,255,.34)' : 'rgba(120,135,160,.10)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = Math.max(.4, r * .035); ctx.stroke();
    }
  }
  // kleine AB-Lichter wie am echten Kristall
  [[-.35, .3, 'rgba(70,130,255,.45)'], [.42, -.28, 'rgba(255,205,90,.5)'], [.1, .55, 'rgba(255,140,200,.35)']].forEach(([dx, dy, c]) => {
    const g = ctx.createRadialGradient(x + dx * r, y + dy * r, 0, x + dx * r, y + dy * r, r * .3);
    g.addColorStop(0, c); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  });
  ctx.restore();
}

function drawKlarGlas(ctx, x, y, r) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
  // Glaskörper: fast durchsichtig
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  // Regenbogenschleier, ganz zart
  const s = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  s.addColorStop(0,   'rgba(120,220,255,.14)');
  s.addColorStop(.32, 'rgba(200,160,255,.119)');
  s.addColorStop(.58, 'rgba(255,225,150,.126)');
  s.addColorStop(.82, 'rgba(150,255,210,.105)');
  s.addColorStop(1,   'rgba(255,170,220,.126)');
  ctx.fillStyle = s; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  // Rand: nur aussen etwas dunkler, damit die Kugel Form hat
  const e = ctx.createRadialGradient(x, y, r * .62, x, y, r);
  e.addColorStop(0, 'rgba(120,130,150,0)'); e.addColorStop(.8, 'rgba(120,130,150,.14)'); e.addColorStop(1, 'rgba(95,105,125,.42)');
  ctx.fillStyle = e; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  // Glanzpunkt oben links, kleiner Lichtreflex unten rechts (Glas)
  const h = ctx.createRadialGradient(x - r * .3, y - r * .34, 0, x - r * .3, y - r * .34, r * .42);
  h.addColorStop(0, 'rgba(255,255,255,.95)'); h.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = h; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  const l = ctx.createRadialGradient(x + r * .38, y + r * .42, 0, x + r * .38, y + r * .42, r * .34);
  l.addColorStop(0, 'rgba(255,255,255,.55)'); l.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = l; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  ctx.restore();
}

function drawSphere(ctx, x, y, r, base, shimmer, gloss, stop = 0.42) {
  if (stop === 'klar') return drawKlar(ctx, x, y, r);
  const g = ctx.createRadialGradient(x-r*.35,y-r*.38,r*.04,x+r*.1,y+r*.1,r*1.05);
  g.addColorStop(0,shimmer); g.addColorStop(stop,base); g.addColorStop(1,darken(base,.48));
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  const sh = ctx.createRadialGradient(x-r*.28,y-r*.32,0,x-r*.28,y-r*.32,r*.4);
  sh.addColorStop(0,`rgba(255,255,255,${gloss})`); sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=sh; ctx.fill();
}

function drawBicone(ctx, x, y, r, base, shimmer, gloss) {
  const w = r, h = r * 0.96;
  ctx.beginPath();
  ctx.moveTo(x, y-h);
  ctx.bezierCurveTo(x+w*.45,y-h*.70, x+w,y-h*.12, x+w,y);
  ctx.bezierCurveTo(x+w,y+h*.12, x+w*.45,y+h*.70, x,y+h);
  ctx.bezierCurveTo(x-w*.45,y+h*.70, x-w,y+h*.12, x-w,y);
  ctx.bezierCurveTo(x-w,y-h*.12, x-w*.45,y-h*.70, x,y-h);
  ctx.closePath();
  const g = ctx.createRadialGradient(x-w*.38,y-h*.36,h*.04,x+w*.1,y+h*.1,h);
  g.addColorStop(0,shimmer); g.addColorStop(.42,base); g.addColorStop(1,darken(base,.48));
  ctx.fillStyle=g; ctx.fill();
  const sh = ctx.createRadialGradient(x-w*.3,y-h*.3,0,x-w*.3,y-h*.3,h*.42);
  sh.addColorStop(0,`rgba(255,255,255,${gloss})`); sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh; ctx.fill();
}

// ── Karabiner ────────────────────────────────────────────────

// Metallglanz: Verlauf von hell nach dunkel quer über das Teil
function metall(ctx, mc, x0, x1) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, mc.shimmer); g.addColorStop(.45, mc.hex); g.addColorStop(1, darken(mc.hex, .62));
  return g;
}

function drawKarabiner(ctx, cx, startY, mc) {
  ctx.save();
  const glanz = metall(ctx, mc, cx - 14, cx + 16);
  ctx.strokeStyle = glanz;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Form: Halbkreis oben + Dreieck unten + Ösenring ganz unten
  // Links: Halbkreis & Dreieck berühren sich fast | Rechts: Federhebel

  const scR  = 12;            // Kreis-Radius
  const scCY = startY + scR;  // Halbkreis-Mittelpunkt Y
  const triH = 26;            // Dreieck-Höhe
  const tipY = scCY + triH;   // Dreieckspitze (unten)

  // Kreis 60% geschlossen / 40% offen (144° Lücke unten)
  const gapAngle  = 0.28 * Math.PI;              // ~50° je Seite
  const arcStart  = Math.PI / 2 + gapAngle;      // 0.9π – untere-links Lücke
  const arcEnd    = Math.PI / 2 - gapAngle;      // 0.1π – untere-rechts Lücke
  const gapLX = cx + scR * Math.cos(arcStart);   // x links Lücke
  const gapLY = scCY + scR * Math.sin(arcStart); // y links Lücke
  const gapRX = cx + scR * Math.cos(arcEnd);     // x rechts Lücke
  const gapRY = scCY + scR * Math.sin(arcEnd);   // y rechts Lücke

  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(cx, scCY, scR, arcStart, arcEnd, false); // Bogen durch oben
  ctx.stroke();

  // Dreieck – Metallfarbe, geschlossen
  // Ecken passen zu den Lückenrändern des Kreises
  ctx.beginPath();
  ctx.moveTo(gapLX + 1, gapLY - 1);   // oben links (1px Spalt = fast-Berührung)
  ctx.lineTo(cx, tipY);                 // Spitze unten
  ctx.lineTo(gapRX - 1, gapRY - 1);   // oben rechts
  ctx.closePath();
  ctx.fillStyle = glanz;
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Federschnapper – diagonal von Bogen-Rechts nach unten-außen
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(gapRX, gapRY);
  ctx.lineTo(gapRX + 5, gapRY - 9);
  ctx.stroke();

  // Ösenring unten
  const ringR = 3.3;   // kleine Öse, in der der erste Ring des Bündels hängt
  const ringY = tipY + ringR;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, ringY, ringR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
  return ringY + ringR + 2;
}

// ── Bündel ───────────────────────────────────────────────────
// Aufbau wie am echten Stück: In der Öse des Verschlusses hängt der erste Ring,
// darunter vier weitere als Kette. Am 1. Ring hängen zwei Perlen, am 2. eine,
// am 3. zwei, am 4. zwei, am 5. eine. Jede Perle sitzt auf einem Stift mit Kugel
// unten; oben ist der Stift zur ovalen Schlaufe gebogen, die im Ring hängt.
// Perle: [x, y unter dem ersten Ring, Nummer des Rings]
const BUENDEL = [
  [-15, 13, 0], [15, 13, 0],
  [  0, 25, 1],
  [-14, 32, 2], [14, 33, 2],
  [ -9, 46, 3], [ 9, 47, 3],
  [  0, 59, 4],
];
const BUENDEL_HOEHE = 79;   // von der Mitte der Öse bis unter die unterste Kugel

// Bicone von der Seite: Mittelkante quer zum Stift, abgeflachte Spitzen am Stift
function drawBiconeSeite(ctx, x, y, r, c, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-t);
  const w = r * 1.08, h = r * .98, k = .34 * w;
  const pfad = () => { ctx.beginPath(); ctx.moveTo(-k, -h); ctx.lineTo(k, -h); ctx.lineTo(w, 0); ctx.lineTo(k, h); ctx.lineTo(-k, h); ctx.lineTo(-w, 0); ctx.closePath(); };
  pfad();
  const g = ctx.createRadialGradient(-w * .38, -h * .4, h * .05, w * .1, h * .1, h * 1.25);
  g.addColorStop(0, c.shimmer); g.addColorStop(.42, c.hex); g.addColorStop(1, darken(c.hex, .5));
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); pfad(); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.beginPath(); ctx.moveTo(-w, 0); ctx.lineTo(-k, -h); ctx.lineTo(0, -h); ctx.lineTo(-w * .25, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.13)'; ctx.beginPath(); ctx.moveTo(w, 0); ctx.lineTo(k, h); ctx.lineTo(0, h); ctx.lineTo(w * .25, 0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = .7; ctx.beginPath(); ctx.moveTo(-w, 0); ctx.lineTo(w, 0); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = .5; ctx.beginPath(); ctx.moveTo(-w * .25, 0); ctx.lineTo(0, -h); ctx.moveTo(w * .25, 0); ctx.lineTo(0, h); ctx.stroke();
  const sh = ctx.createRadialGradient(-w * .32, -h * .36, 0, -w * .32, -h * .36, h * .5);
  sh.addColorStop(0, 'rgba(255,255,255,.7)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh; ctx.fillRect(-w, -h, 2 * w, 2 * h);
  ctx.restore(); ctx.restore();
}

// oeseY = Mitte der Öse am Verschluss. kristall(i) liefert die Farbe der Perle i (0 bis 7).
function drawBuendel(ctx, cx, oeseY, mc, kristall) {
  const R = 10, D = 9, y0 = oeseY + 4.5;
  const ringY = i => y0 + i * D;
  ctx.save(); ctx.lineCap = 'round';
  ctx.lineWidth = 1.7; ctx.strokeStyle = metall(ctx, mc, cx - 6, cx + 6);
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.ellipse(cx, ringY(i), (i % 2 ? 1.9 : 4.2), 6.0, 0, 0, Math.PI * 2); ctx.stroke(); }
  // aussen hängende Perlen zuerst, die mittleren liegen davor
  [0, 1, 3, 4, 5, 6, 2, 7].forEach(i => {
    const c = kristall(i), p = BUENDEL[i];
    const ax = cx + (p[0] < 0 ? -2.5 : p[0] > 0 ? 2.5 : 0), ay = ringY(p[2]) + 3.5;
    const bx = cx + p[0], by = y0 + p[1];
    const L = Math.hypot(bx - ax, by - ay), dx = (bx - ax) / L, dy = (by - ay) / L, t = Math.atan2(dx, dy);
    ctx.strokeStyle = mc.hex; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(ax + dx * 5, ay + dy * 5); ctx.lineTo(bx, by); ctx.stroke();                    // Stift
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(ax + dx * 1.6, ay + dy * 1.6, 2.1, 3.7, -t, 0, Math.PI * 2); ctx.stroke();     // ovale Schlaufe
    drawSphere(ctx, bx + dx * (R + 2.3), by + dy * (R + 2.3), 2.9, mc.hex, mc.shimmer, 0.75);                  // Kugel am Stiftende
    if (c.shape === 'lava') (state.lava === 'Helles Kupfer' ? drawLavaKupfer : drawLava)(ctx, bx, by, R);
    else if (c.shape === 'bicone') drawBiconeSeite(ctx, bx, by, R, c, t);
    else drawSphere(ctx, bx, by, R, c.hex, c.shimmer, 0.65, c.stop);
  });
  ctx.restore();
}

function drawCharm(ctx, cx, startY) {
  const mc = getMetalColor();
  const y = drawKarabiner(ctx, cx, startY, mc);
  drawBuendel(ctx, cx, y - 5.3, mc, getCrystalAt);   // y - 5.3 = Mitte der Öse
}

function drawCanvas() {
  const canvas = document.getElementById('charm-canvas');
  const ctx    = canvas.getContext('2d');
  const Q = 3;   // Schärfe: die Zeichenfläche hat Q-mal so viele Bildpunkte wie ihre Grösse auf der Seite
  ctx.setTransform(Q, 0, 0, Q, 0, 0);
  ctx.clearRect(0, 0, canvas.width / Q, canvas.height / Q);
  const s = 1.45;
  const cx = 150;
  ctx.save();
  ctx.translate(cx, 0);
  ctx.scale(s, s);
  ctx.translate(-cx, 0);
  drawCharm(ctx, 150, 8);
  ctx.restore();
  updateLabel();
  updateSummary();
  updateProgress();
  updateHeadings();
}

// ── UI-Logik ─────────────────────────────────────────────────

function setMetal(metal, btn) {
  state.metal = metal;
  document.querySelectorAll('#metal-row .option-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  drawCanvas();
}

function setCount(n, btn) {
  // Bisher gewählte Farben, Anordnung und Lava bleiben, soweit sie passen (seit 14.10.2026)
  state.count = n;
  const numSlots = n === 3 ? 3 : n;
  state.slots = Array.from({ length: numSlots }, (_, i) => state.slots[i] || null);
  document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // Lava-Wahl nur bei "3 Farben + Lava"
  document.getElementById('lava-block').style.display = (LAVA_KUPFER_VERFUEGBAR && n === 3) ? 'block' : 'none';
  // Anordnung nur bei mehr als einer Farbe
  if (n === 1) state.mode = 'mix';
  else if (state.mode === 'mix' && !document.querySelector('#mode-row .option-btn.active')) state.mode = null;
  document.getElementById('mode-section').style.display = n === 1 ? 'none' : 'block';
  const fertig = n === 1 || !!state.mode;
  document.getElementById('color-section').style.display = fertig ? 'block' : 'none';
  if (fertig) renderSlots();
  drawCanvas();
}

function setLava(lava, btn) {
  state.lava = lava;
  document.querySelectorAll('#lava-row .option-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  drawCanvas();
}

function setMode(mode, btn) {
  state.mode  = mode;
  const numSlots = state.count === 3 ? 3 : state.count;
  state.slots = Array.from({ length: numSlots }, (_, i) => state.slots[i] || null);
  document.querySelectorAll('#mode-row .option-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSlots();
  document.getElementById('color-section').style.display = 'block';
  drawCanvas();
}

// Kleiner Kristall für die Farb-Chips – gleiche Form und gleicher Schimmer wie in der Vorschau
function colorDot(c, size = 18) {
  const dpr = 2;
  const cv  = document.createElement('canvas');
  cv.width  = size * dpr;
  cv.height = size * dpr;
  cv.className = 'color-dot';
  cv.style.width  = size + 'px';
  cv.style.height = size + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const r = size * 0.42;
  if (c.shape === 'bicone') drawBicone(ctx, size / 2, size / 2, r, c.hex, c.shimmer, 0.72, 0);
  else                      drawSphere(ctx, size / 2, size / 2, r, c.hex, c.shimmer, 0.65, c.stop);
  return cv;
}

function renderSlots() {
  const wrapper = document.getElementById('slots-wrapper');
  wrapper.innerHTML = '';
  let labels;
  const v = state.mode === 'verlauf';
  if (state.count === 1) {
    labels = ['Kristallfarbe'];
  } else if (state.count === 2) {
    // Beschriftung nur "Farbe 1/2" (seit 14.10.2026): wo die Farbe sitzt, zeigt die Zeichnung
    labels = ['Farbe 1', 'Farbe 2'];
  } else if (state.count === 3) {
    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:14px;color:#111;margin-bottom:14px;';
    hint.textContent = 'Zwei Lavaperlen sitzen fest im Bündel, dazu kommen deine drei Farben.';
    wrapper.appendChild(hint);
    labels = ['Farbe 1', 'Farbe 2', 'Farbe 3'];
  } else {
    labels = ['Farbe 1', 'Farbe 2', 'Farbe 3', 'Farbe 4'];
  }
  for (let i = 0; i < state.count; i++) {
    const div = document.createElement('div');
    div.className = 'color-slot';
    div.innerHTML = `<div class="slot-label">${labels[i]}</div><div class="color-options" id="slot-${i}"></div>`;
    wrapper.appendChild(div);
    const container = document.getElementById(`slot-${i}`);
    COLORS.forEach(c => {
      const chip = document.createElement('button');
      chip.className = 'color-chip' + (state.slots[i] === c.name ? ' active' : '');
      chip.appendChild(colorDot(c));
      chip.appendChild(document.createTextNode(c.name));
      chip.onclick = () => {
        state.slots[i] = c.name;
        container.querySelectorAll('.color-chip').forEach(b => b.classList.remove('active'));
        chip.classList.add('active');
        drawCanvas();
      };
      container.appendChild(chip);
    });
  }
}

function lavaComplete() {
  return !LAVA_KUPFER_VERFUEGBAR || state.count !== 3 || !!state.lava;
}

function isReady() {
  return state.metal && state.count && state.mode && lavaComplete() &&
         state.slots.filter(Boolean).length === state.slots.length && state.slots.length > 0;
}

function updateLabel() {
  const label = document.getElementById('preview-label');
  if (isReady()) {
    const colorStr = state.count === 1 ? state.slots[0] : state.slots.join(' · ');
    const lavaStr = state.count === 3 && state.lava === 'Helles Kupfer' ? ' · Lava Helles Kupfer' : '';
    label.textContent = `Bündel Charm · ${colorStr} · ${state.metal}${lavaStr}`;
    label.className = 'preview-label filled';
  } else {
    label.textContent = 'Wähle dein Edelstahl und deine Kristallfarben.';
    label.className = 'preview-label';
  }
}

function updateSummary() {
  if (isReady()) {
    document.getElementById('summary-box').classList.add('visible');
    const s = buildSummary();
    // Erste Zeile nicht fett, alles in derselben Schrift; kopiert und verlinkt wird immer buildSummary()
    document.getElementById('summary-text').textContent = s;
    document.getElementById('order-btn').href = bestellLink();
    document.getElementById('mini-vorschau').src = document.getElementById('charm-canvas').toDataURL('image/png');
    document.getElementById('order-btn').classList.remove('gesperrt');
    document.getElementById('copy-btn').classList.remove('versteckt');
    const h = document.querySelector('.order-hint');
    if (h.dataset.orig === undefined) h.dataset.orig = h.textContent;
    h.textContent = h.dataset.orig;
  } else if (STAND_ZEILEN().some(z => z[1])) {
    // Noch nicht fertig: Kasten zeigt den Stand. Der Bestelltext (buildSummary) entsteht erst,
    // wenn alles gewählt ist – bis dahin kein Kopieren und kein Bestell-Link.
    document.getElementById('summary-box').classList.add('visible');
    const st = document.getElementById('summary-text');
    st.innerHTML = '';
    const offen = [];
    STAND_ZEILEN().forEach(([name, wert]) => {
      const z = document.createElement('div');
      z.className = wert ? 'fertig' : 'offen';
      z.textContent = wert ? name + ': ' + wert : name + ': noch wählen';
      st.appendChild(z);
      if (!wert) offen.push(name);
    });
    const ob = document.getElementById('order-btn');
    ob.classList.add('gesperrt'); ob.removeAttribute('href');
    document.getElementById('copy-btn').classList.add('versteckt');
    const h = document.querySelector('.order-hint');
    if (h.dataset.orig === undefined) h.dataset.orig = h.textContent;
    h.textContent = 'Noch offen: ' + offen.join(', ');
    document.getElementById('mini-vorschau').src = document.querySelector('#bracelet-canvas, #earring-canvas, #charm-canvas').toDataURL('image/png');
  } else {
    document.getElementById('summary-box').classList.remove('visible');
  }
  updateBild();
}

function buildSummary() {
  let colorLines;
  const v = state.mode === 'verlauf';
  if (state.count === 1) {
    colorLines = `Kristallfarbe: ${state.slots[0]}`;
  } else if (state.count === 2) {
    colorLines = `Farbe 1: ${state.slots[0]}\nFarbe 2: ${state.slots[1]}`;
  } else if (state.count === 3) {
    colorLines = v
      ? `Lava\nFarbe 1: ${state.slots[0]}\nFarbe 2: ${state.slots[1]}\nFarbe 3: ${state.slots[2]}`
      : `Lava\nFarbe 1: ${state.slots[0]}\nFarbe 2: ${state.slots[1]}\nFarbe 3: ${state.slots[2]}`;
  } else {
    colorLines = state.slots.map((s, i) => `Farbe ${i+1}: ${s}`).join('\n');
  }
  const modeLine = state.count > 1 ? `\nAnordnung: ${v ? 'Farbverlauf' : 'Mix'}` : '';
  const lavaLine = LAVA_KUPFER_VERFUEGBAR && state.count === 3 && state.lava ? `\nLava: ${state.lava}` : '';
  return `Bündel Charm\n${colorLines}${modeLine}\nEdelstahl: ${state.metal}${lavaLine}\nPreis: 35 €`;
}

// Fertigen Charm als Bild speichern (wie im Wunscharmband). Im Shop nur mit dem Einbau-Code ohne Abschottung.
let auswahlBlob = null;
function updateBild() {
  const fertig = !!isReady();
  document.getElementById('save-row').classList.toggle('visible', fertig);
  auswahlBlob = null;
  document.getElementById('save-hint').textContent = '';
  if (fertig) auswahlBild().toBlob(b => { auswahlBlob = b; }, 'image/png');
}

function auswahlBild() {
  const quelle = document.getElementById('charm-canvas');
  const S = 1080, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f3ef'; g.fillRect(0, 0, S, S);
  // Auswahl-Zeile an den Trennpunkten umbrechen
  g.font = "400 36px 'Cormorant Garamond', Georgia, serif";
  const teile = document.getElementById('preview-label').textContent.split(' · ');
  const zeilen = [];
  let z = '';
  teile.forEach(t => {
    const probe = z ? z + ' · ' + t : t;
    if (z && g.measureText(probe).width > S - 120) { zeilen.push(z + ' ·'); z = t; } else z = probe;
  });
  if (z) zeilen.push(z);
  const zh = 48, textH = zeilen.length * zh;
  const B = Math.min(S - 40, S - textH - 70);          // Platz für den Charm
  const bw = Math.min(S - 40, B * quelle.width / quelle.height), bh = bw * quelle.height / quelle.width;
  g.drawImage(quelle, (S - bw) / 2, 10 + (B - bh) / 2, bw, bh);
  g.fillStyle = '#111'; g.textAlign = 'center'; g.textBaseline = 'middle';
  zeilen.forEach((t, i) => g.fillText(t, S / 2, S - 40 - textH + zh / 2 + i * zh));
  return c;
}

const istIPhone = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function bildSpeichern() {
  if (!auswahlBlob) return;
  const hinweis = document.getElementById('save-hint');
  if (istIPhone) {
    let datei = null;
    try { datei = new File([auswahlBlob], 'mein-buendel-charm.png', { type: 'image/png' }); } catch (e) {}
    if (datei && navigator.canShare && navigator.canShare({ files: [datei] })) {
      navigator.share({ files: [datei] }).catch(() => {});
      hinweis.innerHTML = 'Im Menü auf <strong>Bild sichern</strong> tippen, dann liegt dein Charm in deinen Fotos.';
      return;
    }
  }
  const url = URL.createObjectURL(auswahlBlob), a = document.createElement('a');
  a.href = url; a.download = 'mein-buendel-charm.png';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  const txt = document.getElementById('btn-speichern-text');
  txt.textContent = 'Gespeichert';
  setTimeout(() => { txt.textContent = 'Bild speichern'; }, 2000);
}

// "Jetzt bestellen" (wie im Wunscharmband): öffnet die Bestellseite in der Shop-Seite selbst (target="_top").
// Das Shop-Skript füllt den Auswahltext (t) ins Feld; mehr gibt es auf der Bestellseite nicht zu wählen.
const BESTELLSEITE = 'https://laroyallanzarote.com/products/bundel-charm-wunschanfertigung';
function bestellLink() {
  return BESTELLSEITE + '?t=' + encodeURIComponent(buildSummary());
}

// Kopieren ist nur noch Reserve: kleines Symbol oben rechts im Kasten.
const KOPIER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>';
const KOPIER_HAKEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function copyText() {
  const text = buildSummary();
  const btn = document.getElementById('copy-btn');
  function fertig() {
    btn.innerHTML = KOPIER_HAKEN;
    setTimeout(() => { btn.innerHTML = KOPIER_ICON; }, 2000);
  }
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
    ta.style.left = '-9999px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    fertig();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(fertig).catch(() => fallback());
  } else {
    fallback();
  }
}


// Fortschrittsbalken (seit 14.10.2026): Anordnung nur, wenn mehr als eine Farbe gewählt ist.
function schritte() {
  const s = [['Edelstahl', !!state.metal], ['Farb-Anzahl', !!state.count && lavaComplete()]];
  if (state.count !== 1) s.push(['Anordnung', !!state.mode]);
  s.push(['Farben', state.slots.length > 0 && state.slots.every(Boolean)]);
  return s;
}

function updateProgress() {
  const el = document.getElementById('progress');
  const S = schritte();
  const current = S.findIndex(x => !x[1]);   // erster offener Schritt, -1 = alles fertig
  el.innerHTML = S.map(([label, done], i) => {
    const cls = done ? 'p-step done' : (i === current ? 'p-step current' : 'p-step');
    const dot = done ? '\u2713' : (i + 1);
    return `<div class="${cls}"><div class="p-dot">${dot}</div><div class="p-label">${label}</div></div>`;
  }).join('');
}

// Initial draw

// ---- Überschriften zeigen die Auswahl (seit 14.10.2026) ----
// Jede Schritt-Überschrift wird nach der Wahl zu "✓ Name · Wert" (schwarz, Haken golden, Balken links).
// Offene Schritte behalten ihre Nummer. Bei Einfarbig fällt die Feldzeile "Kristallfarbe" weg,
// die Farbe steht dann in der Überschrift. Die Werte kommen aus HEADING_WERTE (je Datei).
const HEAD_ORIG = {};
function setHeading(id, value) {
  const el = document.getElementById(id);
  if (!el) return;
  if (HEAD_ORIG[id] === undefined) HEAD_ORIG[id] = el.textContent;
  if (value) {
    const name = HEAD_ORIG[id].replace(/^\d+ · /, '').replace(/ wählen$/, '').replace('Wie viele Kristallfarben?', 'Farb-Anzahl');
    el.innerHTML = '<span class="haken">✓</span> ' + name + ' · <span class="wahl"></span>';
    el.querySelector('.wahl').textContent = value;
    el.classList.add('done');
  } else {
    el.textContent = HEAD_ORIG[id];
    el.classList.remove('done');
  }
}
function countWert() {
  const b = document.querySelector('.count-btn.active');
  return b ? b.textContent.trim() : null;
}
function farbenWert() {
  if (!state.count || state.slots.length === 0 || !state.slots.every(Boolean)) return null;
  return [...new Set(state.slots)].join(', ');
}
// Sichtbare Schritte werden fortlaufend nummeriert (seit 14.10.2026): fällt ein Schritt weg
// (Lava bei Bündel, Anordnung bei Einfarbig), rücken die Nummern nach – keine Lücke wie "1, 2, 4".
function nummerieren() {
  let n = 0;
  document.querySelectorAll('.section-label').forEach((el, i) => {
    if (!el.id) el.id = 'section-label-' + i;
    if (el.offsetParent === null) return;
    n++;
    const alt = HEAD_ORIG[el.id] !== undefined ? HEAD_ORIG[el.id] : el.textContent;
    HEAD_ORIG[el.id] = n + ' · ' + alt.replace(/^\d+ · /, '');
  });
}
function updateHeadings() {
  nummerieren();
  HEADING_WERTE().forEach(([id, wert]) => setHeading(id, wert));
  document.querySelectorAll('.color-slot').forEach((div, i) => {
    const lab = div.querySelector('.slot-label');
    if (!lab) return;
    if (state.count === 1) { lab.style.display = 'none'; return; }
    lab.style.display = '';
    if (lab.dataset.orig === undefined) lab.dataset.orig = lab.textContent;
    if (state.slots[i]) {
      lab.innerHTML = '<span class="haken">✓</span> ' + lab.dataset.orig + ' · <span class="wahl"></span>';
      lab.querySelector('.wahl').textContent = state.slots[i];
      lab.classList.add('done');
    } else { lab.textContent = lab.dataset.orig; lab.classList.remove('done'); }
  });
}

function HEADING_WERTE() {
  // "3 Farben + Lava" gilt erst als erledigt, wenn auch die Lava-Farbe gewählt ist
  let count = countWert();
  if (count && state.count === 3) count = lavaComplete() ? count + (state.lava ? ' · ' + state.lava : '') : null;
  return [
    ['metal-section-label', state.metal],
    ['count-section-label', count],
    ['mode-section-label', (state.mode && state.count > 1) ? (state.mode === 'verlauf' ? 'Farbverlauf' : 'Mix') : null],
    ['color-section-label', farbenWert()],
  ];
}


function STAND_ZEILEN() {
  const W = Object.fromEntries(HEADING_WERTE());
  return [
    ['Edelstahl', W['metal-section-label']],
    ['Farb-Anzahl', state.count === 3 ? countWert() : W['count-section-label']],   // Lava steht bei 3 Farben in einer eigenen Zeile
    ...(LAVA_KUPFER_VERFUEGBAR && state.count === 3 ? [['Lava', state.lava]] : []),
    ...(state.count !== 1 ? [['Anordnung', W['mode-section-label']]] : []),
    ['Farben', W['color-section-label']],
  ];
}

drawCanvas();

function sendHeight() {
  const card = document.querySelector('.card');
  const h = card ? card.getBoundingClientRect().bottom : document.body.scrollHeight;
  window.parent.postMessage({ iframeHeight: Math.ceil(h), iframeId: 'charmconfig' }, '*');
}
const ro = new ResizeObserver(sendHeight);
ro.observe(document.body);
sendHeight();
</script>
