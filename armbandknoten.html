<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Armband knoten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display&display=swap" rel="stylesheet">
<style>
  :root{--ink:#000;--line:#e6e8ea;--navy:#1f2d5c;--mint:#7fd6d0}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font-family:Montserrat,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:min(720px,calc(100vh - 118px));min-width:260px;margin:0 auto;padding:8px}
  canvas{width:100%;height:auto;display:block;border-radius:6px;border:1px solid var(--line);background:#fff}
  input[type=range]{width:100%;margin:16px 0 8px;accent-color:var(--navy)}
  .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
  button{font:inherit;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding:13px 22px;border-radius:999px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;min-width:120px}
  button.sec{background:#fff;color:var(--navy);border-color:var(--line)}
  @media(max-width:480px){button{padding:12px 13px;min-width:0;font-size:12px;letter-spacing:.07em}.ctl{gap:8px;flex-wrap:nowrap}}
  label{font-size:14px;display:flex;gap:8px;align-items:center;width:100%;justify-content:center;margin-top:6px;color:#000}
  label input{accent-color:var(--navy)}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="1000" height="1000" aria-label="Animation: Armband neu knoten"></canvas>
  <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Zeitleiste">
  <div class="ctl">
    <button class="sec" id="prev">◀ Zurück</button>
    <button id="play">Abspielen</button>
    <button class="sec" id="next">Weiter ▶</button>
  </div>
</div>
<script>
const C=document.getElementById('c');let g=C.getContext('2d');const MAINCTX=g,OFF=document.createElement('canvas'),OFFCTX=OFF.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);C.width=1000*DPR;C.height=1000*DPR;OFF.width=C.width;OFF.height=C.height;
const COL={bg:'#ffffff',ink:'#000000',a:'#e0483a',b:'#1b9aa0',m:'#f1f4f5',out:'#1d1d1f',soft:'#000000',gold:'#1f2d5c',mint:'#fff9d6',navy:'#1f2d5c'};
const mix=(h1,h2,t)=>{const f=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),a=f(h1),b=f(h2);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('');};
const PI=Math.PI,cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,
      ez=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,ph=(p,a,b)=>cl((p-a)/(b-a));
const CX=500,YC=720,YB=668,BR=62,W=14,K=[1,2,1,2],HK=n=>n==1?16:26,SQ=.88;
const cum=k=>K.slice(0,k).reduce((s,n)=>s+HK(n),0);
const HS=cum(4)*SQ,TOPF=YB-HS,MID=YB-HS/2;

/* ---------- Zeichenhilfen ---------- */
function quad(p0,p1,p2,n){const r=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;r.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]);}return r;}
let PID=0;
function addPoly(segs,pts,z,c,w=W){const id=++PID;for(let i=1;i<pts.length;i++){segs.push({id,x1:pts[i-1][0],y1:pts[i-1][1],x2:pts[i][0],y2:pts[i][1],z:typeof z=='function'?z(i):(Array.isArray(z)?z[i]:z),c,w});}}
/* Linien als durchgehende Züge zeichnen (glatte Ränder); wer oben liegt, entscheidet die Höhe z */
function drawSegs(segs){const runs=[];let cur=null;
  for(const s of segs){const lv=Math.round(s.z*2)/2;if(!cur||cur.id!==s.id||cur.lv!==lv){cur={id:s.id,lv,c:s.c,w:s.w,pts:[[s.x1,s.y1]],o:runs.length};runs.push(cur);}cur.pts.push([s.x2,s.y2]);}
  {const seen={};for(let i=runs.length-1;i>=0;i--){if(!seen[runs[i].id]){seen[runs[i].id]=1;runs[i].end=1;}}}
  runs.sort((u,v)=>u.lv-v.lv||u.o-v.o);g.lineJoin='round';
  for(const r of runs){if(r.end){const e=r.pts[r.pts.length-1];g.fillStyle=COL.out;g.beginPath();g.arc(e[0],e[1],(r.w+5)/2,0,2*PI);g.fill();}g.beginPath();g.moveTo(r.pts[0][0],r.pts[0][1]);for(let i=1;i<r.pts.length;i++)g.lineTo(r.pts[i][0],r.pts[i][1]);g.lineCap='butt';g.strokeStyle=COL.out;g.lineWidth=r.w+5;g.stroke();g.lineCap='round';g.strokeStyle=r.c;g.lineWidth=r.w;g.stroke();}}
function resampleN(pts,n){let tot=0;for(let i=1;i<pts.length;i++)tot+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);const o=[pts[0].slice()],st=tot/(n-1);let acc=0;
  for(let i=1;i<pts.length&&o.length<n-1;i++){const a=pts[i-1],b=pts[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<1e-6)continue;let t=0;while(acc+d*(1-t)>=st&&o.length<n-1){const f=t+(st-acc)/d;o.push([lerp(a[0],b[0],f),lerp(a[1],b[1],f)]);t=f;acc=0;}acc+=d*(1-t);}
  while(o.length<n)o.push(pts[pts.length-1].slice());return o;}
function soft(pts,zs,step=4,win=4,passes=2){{let tot=0;for(let i=1;i<pts.length;i++)tot+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);step=Math.max(.5,tot/150);}const P=[pts[0]],Z=[zs[0]];let acc=0;
  for(let i=1;i<pts.length;i++){let ax=pts[i-1][0],ay=pts[i-1][1];const bx=pts[i][0],by=pts[i][1];let d=Math.hypot(bx-ax,by-ay);if(d<1e-6)continue;let t=0;
    while(acc+d*(1-t)>=step){const need=step-acc,f=t+need/d;P.push([lerp(pts[i-1][0],bx,f),lerp(pts[i-1][1],by,f)]);Z.push(lerp(zs[i-1],zs[i],f));t=f;acc=0;}acc+=d*(1-t);}
  P.push(pts[pts.length-1]);Z.push(zs[zs.length-1]);let Q=P;
  for(let k=0;k<passes;k++){const N=Q.map(q=>q.slice());for(let i=1;i<Q.length-1;i++){const w=Math.min(win,i,Q.length-1-i);let sx=0,sy=0;for(let j=-w;j<=w;j++){sx+=Q[i+j][0];sy+=Q[i+j][1];}N[i]=[sx/(2*w+1),sy/(2*w+1)];}Q=N;}
  return[Q,Z];}
function strand(pts,c,w=W){const s=[];addPoly(s,pts,0,c,w);drawSegs(s);}
function bead(x,y,r,col){const gr=g.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);if(col){gr.addColorStop(0,'#eaf5ff');gr.addColorStop(.3,'#5fa9ec');gr.addColorStop(1,'#1d5fb0');}else{gr.addColorStop(0,'#c9c9cf');gr.addColorStop(.3,'#6c6c73');gr.addColorStop(1,'#2c2c31');}g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,2*PI);g.fill();g.strokeStyle=COL.out;g.lineWidth=3;g.stroke();}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function steel(x,y,w,h,alpha=1){g.save();g.globalAlpha=g.globalAlpha*alpha;g.translate(x,y);g.lineJoin='round';
  const gr=g.createLinearGradient(0,-h/2,0,h/2);gr.addColorStop(0,'#ffffff');gr.addColorStop(.5,'#cdd1d5');gr.addColorStop(1,'#7d838a');
  const rim=w*.1,bw=w/2-rim*.7,bh=h*.36,bu=h*.17;g.fillStyle=gr;g.strokeStyle=COL.out;g.lineWidth=3;
  g.beginPath();g.moveTo(-bw,-bh);g.quadraticCurveTo(0,-bh-bu,bw,-bh);g.lineTo(bw,bh);g.quadraticCurveTo(0,bh+bu,-bw,bh);g.closePath();g.fill();g.stroke();
  for(const sd of[-1,1]){rr(sd>0?w/2-rim*1.3:-w/2,-h*.4,rim*1.3,h*.8,rim*.55);g.fill();g.stroke();}
  g.restore();}
function arrow(x1,y1,x2,y2,c=COL.gold,w=7){const a=Math.atan2(y2-y1,x2-x1),h=20;g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*h*.7,y2-Math.sin(a)*h*.7);g.stroke();g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-Math.cos(a-.5)*h,y2-Math.sin(a-.5)*h);g.lineTo(x2-Math.cos(a+.5)*h,y2-Math.sin(a+.5)*h);g.closePath();g.fill();}
let CAPT=null;const cap=(...l)=>{CAPT=l;};
const FF='Montserrat,"Helvetica Neue",Arial,sans-serif';
function text(s,x,y,size,weight=400,c=COL.ink,al='center',maxW=780){const w=weight>=700?600:weight;g.font=`${w} ${size}px ${FF}`;const mw=g.measureText(s).width;if(mw>maxW)g.font=`${w} ${size*maxW/mw}px ${FF}`;g.textAlign=al;g.textBaseline='middle';g.fillStyle=c;g.fillText(s,x,y);}
function lump(y,h,n,rx=17){g.save();g.beginPath();g.ellipse(CX0,y,rx,h/2+1,0,0,2*PI);g.clip();g.fillStyle=COL.a;g.fillRect(CX0-rx-2,y-h,2*rx+4,2*h);g.strokeStyle=COL.b;g.lineWidth=6;for(let i=0;i<n;i++){const yy=y+(i-(n-1)/2)*11;g.beginPath();g.moveTo(CX0-rx-4,yy+7);g.lineTo(CX0+rx+4,yy-7);g.stroke();}g.restore();g.beginPath();g.ellipse(CX0,y,rx,h/2+1,0,0,2*PI);g.strokeStyle=COL.out;g.lineWidth=2.5;g.stroke();}
let CX0=CX;
function stack(k,sq=1,base=YB){let c=0;for(let i=0;i<k;i++){const h=HK(K[i]);lump(base-(c+h/2)*sq,h*sq,K[i]);c+=h;}}

/* ---------- Nahansicht: Armband hängt nach unten, Enden zeigen nach oben ---------- */
const RB=300;
function ringPos(d){const t=d/RB;return{x:CX+RB*Math.sin(t),y:YC+RB-RB*Math.cos(t),a:t};}
function row(gap,opt={}){for(let i=3;i>=0;i--){const q=ringPos(-(gap/2+BR+i*(2*BR+2)));bead(q.x,q.y,BR,i==1);}for(let i=0;i<3;i++){const q=ringPos(gap/2+120+BR+i*(2*BR+2));bead(q.x,q.y,BR,i==0);}
  if(opt.steel!==false){const q=ringPos(gap/2+59);g.save();g.translate(q.x,q.y);g.rotate(q.a);steel(0,0,118,128,opt.alpha??1,-1);g.restore();}}
function connectors(gap,al=1){g.save();g.globalAlpha=al;strand(quad([CX-gap/2-2,YC],[CX-4,YC],[CX-4,YB],8),COL.a,12);strand(quad([CX+gap/2+2,YC],[CX+4,YC],[CX+4,YB],8),COL.b,12);g.restore();}
function restPts(top,side,e=1,n=59){return quad([CX+side*3,top],[CX+side*lerp(120,20,e),top-lerp(0,120,e)],[CX+side*lerp(270,150,e),top-lerp(4,230,e)],n);}
function restPose(top,par,e=1){strand(restPts(top,-1,e),par?COL.b:COL.a);strand(restPts(top,1,e),par?COL.a:COL.b);}

/* ---------- Szenen ---------- */
function scStretch(p){const pulse=Math.pow(Math.sin(PI*2*ph(p,.08,.92)),2),L=190+120*pulse,y=470,w=lerp(11,7,pulse);
  strand([[CX-L,y],[CX+L,y]],COL.m,w);
  for(const s of[-1,1]){g.fillStyle='#fff';g.strokeStyle=COL.out;g.lineWidth=3;g.beginPath();g.arc(CX+s*(L+4),y,20,0,2*PI);g.fill();g.stroke();arrow(CX+s*(L+40),y,CX+s*(L+40+50+30*pulse),y);}
}
function scThread(p){const y=470;strand([[90,y],[910,y]],COL.m);
  for(let i=0;i<6;i++){const q=ez(ph(p,.04+i*.09,.22+i*.09));bead(lerp(1100,215+i*88,q),y,42,i==1||i==4);}
  const q=ez(ph(p,.6,.8)),sx=lerp(1150,215+6*88+12,q);steel(sx,y,96,104,1,1);
  const f=ph(p,.82,.9);if(f>0){g.save();g.globalAlpha=f;arrow(sx,y-140,sx,y-64);g.restore();}
  cap(p<.6?'Fädle die Perlen auf. Lass die Enden dabei nie los.':'Die Edelstahlperle kommt zuletzt.');}
/* Knoten: Enden über Kreuz, ein- oder zweimal umeinander, dann nach links und rechts festziehen */
function scKnot(p,k){const sa=COL.a,sb=COL.b;if(k==0){const t=ez(ph(p,0,.1));COL.a=mix(COL.m,sa,t);COL.b=mix(COL.m,sb,t);}try{scKnotI(p,k);}finally{COL.a=sa;COL.b=sb;}}
function scKnotI(p,k){const TZ=k==0?['Zieh den Knoten zu.','Er legt fest, wie eng das Armband wird.']:['Zieh den Knoten fest.'];const n=K[k],ys=YB-cum(k),cL=k%2?COL.b:COL.a,cR=k%2?COL.a:COL.b,G0=k==0?lerp(150,44,ez(ph(p,.69,.86))):44;row(G0);if(k>0||p>.88)connectors(G0);
  if(p>.88){cap(...TZ);stack(k+1);restPose(YB-cum(k+1),(k+1)%2,ez(ph(p,.9,1)));return;}
  stack(k);
  const aL=ez(ph(p,.01,.09)),a=ez(ph(p,.1,.17)),b=ph(p,.21,.64),c=ez(ph(p,.69,.86));
  const wt=n*b,wi=Math.min(n-1,Math.floor(wt)),w=b>=1?1:wt-wi,tw=b>=1?n:wi+ez(ph(w,.5,1));
  const yk=ys-lerp(160,6,c),Lw=lerp(lerp(0,44+36*(n-1),tw/n),7,c),A=lerp(20,4,c),f1=2*PI*tw,bul=lerp(78,0,c);
  const ER=[lerp(CX+215,CX+270,c),lerp(yk-50,ys-HK(n)-4,c)],EL=[2*CX-ER[0],ER[1]],M=40,zl=Math.cos(f1);
  let L=[],R=[],zL=[],zR=[];
  const hs=k==0?G0/2:4,by=k==0?YC:ys;
  quad([CX-hs,by],[CX-Lw-bul-(k==0?hs*.35:0),(by+yk)/2],[CX-Lw,yk],9).forEach(q=>{L.push(q);zL.push(1);});
  for(let i=1;i<=M;i++){const u=i/M,f=f1*u;L.push([CX-Lw+2*Lw*u,yk-A*Math.sin(f)]);zL.push(Math.cos(f));}
  {const s0=[CX+Lw,yk-A*Math.sin(f1)];
   if(b>0&&b<1){
     /* Das Ende als EIN durchgehendes Band: Bogen außen herum, hinter dem anderen Band in die Schlaufe, vorne wieder heraus */
     const Rq=t=>{const p0=[CX+hs,by],p1=[CX+Lw+bul+(k==0?hs*.35:0),(by+yk)/2],p2=[CX+Lw,yk+A*Math.sin(f1)],v=1-t;return[v*v*p0[0]+2*v*t*p1[0]+t*t*p2[0],v*v*p0[1]+2*v*t*p1[1]+t*t*p2[1]];};
     const Xc=Rq(.5),In=[CX+6,lerp(yk,by,.56)],Up=[CX-6,lerp(yk,by,.24)],u=ph(w,.5,1),aa=1-ez(u),gg=ez(cl(u*4)),mv=q=>[lerp(s0[0],q[0],aa),lerp(s0[1],q[1],aa)];
     const E0=[ER[0]-s0[0],ER[1]-s0[1]],EL0=Math.hypot(E0[0],E0[1]);
     const P=[s0,mv([s0[0]+E0[0]*.8,s0[1]+E0[1]*.8]),mv([s0[0]+228,s0[1]+58]),mv(Xc),mv(In)],Zc=[zl,zl,0,-3,-3];
     if(w>=.5){const e5=[lerp(Up[0],s0[0],u),lerp(Up[1],s0[1],u)],e6=[lerp(Up[0],ER[0],u),lerp(Up[1],ER[1],u)],i4=P[4];P.push([lerp(i4[0],e5[0],gg),lerp(i4[1],e5[1],gg)],[lerp(i4[0],e6[0],gg),lerp(i4[1],e6[1],gg)]);Zc.push(3,3);}
     let C=crs(P,Zc,14);
     if(w<.5){let tot=0;const cum=[0];for(let i=1;i<C.length;i++){tot+=Math.hypot(C[i][0]-C[i-1][0],C[i][1]-C[i-1][1]);cum.push(tot);}
       const want=ez(w/.5)*tot;let m=1;while(m<C.length-1&&cum[m]<want)m++;const fr=cl((want-cum[m-1])/Math.max(1e-6,cum[m]-cum[m-1])),A0=C[m-1],A1=C[m],A2=C[Math.min(C.length-1,m+1)],Am=C[Math.max(0,m-2)];
       const e=[lerp(A0[0],A1[0],fr),lerp(A0[1],A1[1],fr),lerp(A0[2],A1[2],fr)],d0=[A1[0]-Am[0],A1[1]-Am[1]],d1=[A2[0]-A0[0],A2[1]-A0[1]],n0=Math.hypot(d0[0],d0[1])||1,n1=Math.hypot(d1[0],d1[1])||1;
       const dx=lerp(d0[0]/n0,d1[0]/n1,fr),dy=lerp(d0[1]/n0,d1[1]/n1,fr),dl=Math.hypot(dx,dy)||1,ext=EL0*Math.pow(Math.max(0,1-want/(EL0*1.5)),2);C=C.slice(0,m);C.push(e);
       if(ext>2){C.push([e[0]+dx/dl*ext*.5,e[1]+dy/dl*ext*.5,e[2]],[e[0]+dx/dl*ext,e[1]+dy/dl*ext,e[2]]);}}
     C.slice(1).forEach(q=>{L.push([q[0],q[1]]);zL.push(q[2]);});
   }else{const ct=[(s0[0]+ER[0])/2,(s0[1]+ER[1])/2];quad(s0,ct,ER,10).slice(1).forEach(q=>{L.push(q);zL.push(zl);});}}
  quad([CX+hs,by],[CX+Lw+bul+(k==0?hs*.35:0),(by+yk)/2],[CX+Lw,yk+A*Math.sin(f1)],9).forEach(q=>{R.push(q);zR.push(-zl);});
  for(let i=1;i<=M;i++){const u=1-i/M,f=f1*u;R.push([CX-Lw+2*Lw*u,yk+A*Math.sin(f)]);zR.push(-Math.cos(f));}
  for(let i=1;i<=10;i++){R.push([lerp(CX-Lw,EL[0],i/10),lerp(yk,EL[1],i/10)]);zR.push(-1);}
  if(a<1){const r0=sd=>quad([CX+sd*hs,by],[CX+sd*(hs-8),by-140],[CX+sd*(hs+70),by-270],59),rl=k==0?r0(-1):restPts(ys,-1),rr_=k==0?r0(1):restPts(ys,1),NN=70,mx=(A_,B_,t)=>{const u=resampleN(A_,NN),v=resampleN(B_,NN);return u.map((q,i)=>[lerp(q[0],v[i][0],t),lerp(q[1],v[i][1],t)]);};
    L=mx(rl,L,aL);R=mx(rr_,R,a);zL=L.map(()=>1);zR=R.map(()=>-1);}
  const segs=[];{const a_=soft(R,zR),b_=soft(L,zL);addPoly(segs,a_[0],a_[1],cR);addPoly(segs,b_[0],b_[1],cL);}drawSegs(segs);
  if(c>.55){g.save();g.globalAlpha=ph(c,.55,1);stack(k+1);g.restore();}
  cap(...(c>0?TZ:b>0?[n==1?'Führ es von hinten durch die Schlaufe.':'Führ es zweimal von hinten durch die Schlaufe.']:['Leg ein Ende über das andere.']));
  if(b>0&&c==0){text((wi+1)+'×',CX-250,yk+50,76,800,cL);}
  if(c>0&&c<1){arrow(ER[0]-50,ER[1]-36,ER[0]+24,ER[1]-36);arrow(EL[0]+50,EL[1]-36,EL[0]-24,EL[1]-36);}}
function crs(P,Z,n){const o=[],gp=i=>P[cl(i,0,P.length-1)];for(let i=0;i<P.length-1;i++)for(let j=0;j<n;j++){const t=j/n,t2=t*t,t3=t2*t,p0=gp(i-1),p1=gp(i),p2=gp(i+1),p3=gp(i+2),c=d=>.5*((2*p1[d])+(-p0[d]+p2[d])*t+(2*p0[d]-5*p1[d]+4*p2[d]-p3[d])*t2+(-p0[d]+3*p1[d]-3*p2[d]+p3[d])*t3);o.push([c(0),c(1),lerp(Z[i],Z[i+1],t)]);}const l=P[P.length-1];o.push([l[0],l[1],Z[Z.length-1]]);return o;}
function scPull(p){const sq=lerp(1,SQ,ez(ph(p,.1,.5))),top=YB-cum(4)*sq,e=1-.92*Math.sin(PI*ph(p,.05,.95));row(44);connectors(44);stack(4,sq);restPose(top,0,e);
  if(e<.5){arrow(CX-285,top-40,CX-355,top-40);arrow(CX+285,top-40,CX+355,top-40);}}

 {k:'Gut zu wissen',d:6,t:'Und Kleber?',c:['Die Knoten und der Schlupf halten von allein.'],f:scGlue},
 {k:'Geschafft',d:5,t:'Fertig!',c:['Noch Fragen? Schreib mir eine WhatsApp.'],f:scDone}];
let acc=0;for(const s of S){s.s=acc;acc+=s.d;}const TOTAL=acc;
function idxAt(T){for(let i=S.length-1;i>=0;i--)if(T>=S[i].s)return i;return 0;}
function render(T){T=cl(T,0,TOTAL-.001);const i=idxAt(T),lt=T-S[i].s,FD=.5;
  if(i>0&&lt<FD){g=MAINCTX;drawFrame(S[i].s-.002);g=OFFCTX;drawFrame(T);g=MAINCTX;g.setTransform(1,0,0,1,0,0);const al=ez(lt/FD),W_=C.width,HH=Math.round(182*DPR),Y2=Math.round(840*DPR),H2=C.height-Y2;g.globalAlpha=al;g.drawImage(OFF,0,HH,W_,Y2-HH,0,HH,W_,Y2-HH);g.fillStyle='#fff';for(const[y0,hh]of[[0,HH],[Y2,H2]]){if(al<.5){g.globalAlpha=al*2;g.fillRect(0,y0,W_,hh);}else{g.globalAlpha=1;g.fillRect(0,y0,W_,hh);g.globalAlpha=(al-.5)*2;g.drawImage(OFF,0,y0,W_,hh,0,y0,W_,hh);}}g.globalAlpha=1;}else{g=MAINCTX;drawFrame(T);}}
function drawFrame(T){T=cl(T,0,TOTAL-.001);const i=idxAt(T),sc=S[i],p=(T-sc.s)/sc.d;
  g.setTransform(DPR,0,0,DPR,0,0);g.globalAlpha=1;g.fillStyle=COL.bg;g.fillRect(0,0,1000,1000);
  if(typeof sc.k=='number'){const n_=sc.k+' ·';g.font=`600 44px ${FF}`;const w_=g.measureText(n_+' ').width;text(n_,60,112,44,600,COL.b,'left');text(sc.t,60+w_,112,44,500,COL.ink,'left',880-w_);}
  else text(sc.t,60,112,44,500,COL.ink,'left',880);
  CAPT=null;const zo=!!sc.z;g.save();if(zo){g.beginPath();g.rect(0,180,1000,658);g.clip();g.translate(CX,700);g.scale(1.25,1.25);g.translate(-CX,-700);}sc.f(p);g.restore();
  g.globalAlpha=1;let L_=CAPT||sc.c;g.font=`500 32px ${FF}`;
  if(L_.length==1&&g.measureText(L_[0]).width>840){const t=L_[0],mid=t.length/2;let bi=-1;for(let i=0;i<t.length;i++)if(t[i]==' '&&(bi<0||Math.abs(i-mid)<Math.abs(bi-mid)))bi=i;if(bi>0)L_=[t.slice(0,bi),t.slice(bi+1)];}
  g.fillStyle=COL.mint;g.fillRect(0,840,1000,160);
  if(L_.length>1){text(L_[0],CX,897,32,500,COL.ink,'center',900);text(L_[1],CX,943,32,500,COL.ink,'center',900);}else text(L_[0],CX,920,32,500,COL.ink,'center',900);}

/* ---------- Steuerung ---------- */
let T=0,playing=false,last=0;const $=id=>document.getElementById(id),scrub=$('scrub'),playB=$('play'),stopC={checked:false};
function setPlay(v){playing=v;const i=idxAt(T);playB.textContent=v?'Pause':(T>=TOTAL-.01?'Nochmal':(T>=S[i].s+S[i].d-.01?'Nächster Schritt':'Abspielen'));}
function frame(now){const dt=Math.min(.1,(now-last)/1000)||0;last=now;
  if(playing){const i0=idxAt(T);T+=dt;if(T>=TOTAL){T=TOTAL-.001;setPlay(false);}else if(stopC.checked&&idxAt(T)!=i0&&!S[i0].ns){T=S[i0].s+S[i0].d-.001;setPlay(false);}}
  render(T);if(document.activeElement!==scrub)scrub.value=Math.round(T/TOTAL*1000);requestAnimationFrame(frame);}
playB.onclick=()=>{if(!playing){if(T>=TOTAL-.01)T=0;else if(stopC.checked){const i=idxAt(T);if(T>=S[i].s+S[i].d-.01&&i<S.length-1)T=S[i+1].s;}}setPlay(!playing);};
$('prev').onclick=()=>{const i=idxAt(T);T=(T-S[i].s<.7&&i>0)?S[i-1].s:S[i].s;};
$('next').onclick=()=>{const i=idxAt(T);if(i<S.length-1)T=S[i+1].s;};
scrub.oninput=()=>{T=scrub.value/1000*TOTAL;};
document.addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();playB.click();}});
window.seek=t=>{setPlay(false);T=t;render(T);};window.SCENES=S;
if(document.fonts&&document.fonts.load){['400 20px Montserrat','500 20px Montserrat','600 20px Montserrat','400 30px "Playfair Display"'].forEach(f=>document.fonts.load(f));}
requestAnimationFrame(frame);
</script>
